# The Python runtime: one distribution, two processes. Every tool reads its config from here.

[project]
name = "pinecall"
description = "The Pinecall voice-AI runtime: gateway and worker, on LiveKit"
readme = "README.md"
license = "Apache-2.0"
# PEP 639: the text itself travels in the wheel and the sdist, so an install carries its licence.
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Bernardo Castro", email = "me@bernardocastro.dev" }]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  # A range, not a bare name: the wheel PyPI serves must say which protocol it speaks.
  # `[tool.uv.sources]` below still points a checkout at the repo next door — that is a
  # development convenience and does not travel in the wheel.
  "pinecall-protocol>=0.6.12,<0.7",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "asyncpg>=0.29,<1",
  "pgvector>=0.3,<1",
  "typing-extensions>=4.12,<5",
  # The text session IS a livekit llm caller: ChatContext, LLMStream and LLMMetrics are the
  # session's own vocabulary, so the library and the two text plugins are core, not an extra.
  "livekit-agents[anthropic,openai]>=1.8,<2",
  "livekit-api>=1.2.1",
  "pyjwt>=2.13.0",
  # Fernet, and nothing else: a tenant's own provider key is encrypted at rest under the box's
  # PINECALL_VAULT_KEY. See docs/decisions/provider-keys.md.
  "cryptography>=44,<51",
  # argon2id, and nothing else: a member's password is a secret a person invented, and a sha256
  # is a microsecond per guess. A key is 256 bits of CSPRNG and stays on sha256 (auth/keys.py).
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
# The worker's half: the three vendors LiveKit's own inference gateway does not front, so a
# gateway-only install skips them. The VAD and the end-of-turn model are livekit's own native
# ones, inside livekit-agents itself; nothing here imports the silero or turn-detector plugins.
runtime = [
  "livekit-agents[soniox,deepgram,elevenlabs]>=1.8,<2",
  # livekit-plugins-anthropic 1.x still builds the 0.x anthropic client.
  "anthropic<1",
]
# Every other vendor livekit-agents ships a plugin for: the forty rows of
# providers/catalog.py this box has no file of its own for. They are thin HTTP clients — the
# catalog is real without them, and a vendor whose plugin is missing is refused by name with the
# extra that installs it, so this extra is what turns "install" into "ready" on a box.
providers = [
  "livekit-agents[assemblyai,asyncai,baseten,bland,cambai,cartesia,cerebras,clova,fal,fireworksai,fishaudio,gladia,gnani,gradium,groq,hume,inworld,lmnt,minimax,mistralai,murf,neuphonic,nvidia,palabra,perplexity,resemble,respeecher,rime,rtzr,sarvam,simplismart,slng,smallestai,speechify,spitch,upliftai,vakyam,xai]>=1.8,<2",
]
# The four that bring a whole SDK with them and are therefore a decision, not a default: boto3,
# azure-cognitiveservices-speech, the google-cloud clients, and speechmatics — whose `smart`
# extra installs onnxruntime and transformers, a hundred megabytes for one vendor's endpointing.
# A box that runs one of these installs this extra on purpose; nothing else changes.
providers-big = ["livekit-agents[aws,azure,google,speechmatics]>=1.8,<2"]
# Graphiti is the optional memory graph; pgvector is the default and needs no extra.
memory-graph = ["graphiti-core>=0.30,<1"]

[project.scripts]
pinecall-runtime = "pinecall.cli:main"

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "mypy==2.3.1",
  "ruff>=0.16,<1",
  "pytest>=9,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-xdist>=3.8,<4",
  "respx>=0.23,<1",
  "time-machine>=3,<4",
  "pytest-timeout>=2.4.0",
  # Order dependence is a bug the suite must find by itself: every run shuffles.
  "pytest-randomly>=3.16,<4",
  # Lints the .sql of a migration for what it does to a table that HAS rows: a lock held too
  # long, an index built while writes are blocked. `.squawk.toml` says which rules the runner
  # answers instead. Rust, shipped as a wheel, so it costs nothing at import time.
  "squawk-cli>=2.65,<3",
]

[tool.uv.sources]
pinecall-protocol = { path = "../protocol/python", editable = true }

[build-system]
# 1.27 is the first hatchling that writes `license` as a PEP 639 expression.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pinecall/_version.py"

# The console is a build the agents repo's vite wrote and scripts/console copied in: git-ignored,
# because it is not a source, and named here so the wheel carries it anyway.
[tool.hatch.build.targets.wheel]
packages = ["src/pinecall"]
artifacts = ["src/pinecall/gateway/console/**", "src/pinecall/gateway/admin/**", "src/pinecall/gateway/widget/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/pinecall/gateway/console/**", "src/pinecall/gateway/admin/**", "src/pinecall/gateway/widget/**"]

# ── pytest ──────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-p randomly` is named rather than left to the entry point: a virtualenv without the plugin
# fails at startup instead of quietly running the suite in file order.
addopts = "--tb=short -n auto -p randomly --strict-markers --strict-config"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A test that hangs fails in ten seconds, by itself. Nothing that honestly needs longer is a
# unit test, and a hang costs minutes only when it is allowed to last.
timeout = 10
timeout_method = "thread"
filterwarnings = [
  "error",
  # starlette.testclient asks for httpx2 at import time. The WebSocket tests need the TestClient
  # (httpx speaks no WebSocket at all) and the runtime pins httpx 0.x for everything else.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
markers = [
  "unit: ring 0. No keys, no network, under two minutes",
  "postgres: needs DATABASE_URL reachable — the compose dev stack",
  "needs_llm: calls a model. Skipped without ANTHROPIC_API_KEY",
  "voice: drives audio through a real session. Skipped without the runtime extra and keys",
  "evals: the judged suites, ring 1 and up",
]

# ── type checkers ───────────────────────────────────────────────────────────────

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportImplicitOverride = true

[tool.mypy]
files = ["src"]
strict = true
python_version = "3.12"

# ── ruff ────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG", "T201", "FA102", "TC004", "TID251"]
unfixable = ["T201"]

[tool.ruff.lint.per-file-ignores]
# The CLI is the one place that speaks to a terminal.
"src/pinecall/cli/**" = ["T201"]
# And a maintainer's script, which is run by hand and has nowhere else to say what it wrote.
"scripts/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["pinecall", "pinecall_protocol", "tests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The environment is read once, in _settings.py. Everywhere else takes a Settings.
"os.environ".msg = "Read the environment through pinecall._settings, nowhere else."
"os.getenv".msg = "Read the environment through pinecall._settings, nowhere else."
