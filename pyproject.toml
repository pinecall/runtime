# The repository: a uv workspace of two distributions under packages/ — `pinecall`, the runtime,
# and `pinecall-core`, the shapes it speaks and the points a policy plugs into — one lock, one
# venv, and the tools and suites configured here, once, for both.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "mypy==2.3.1",
  "ruff>=0.16,<1",
  "pytest>=9,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-xdist>=3.8,<4",
  "pytest-timeout>=2.4.0",
  # Order dependence is a bug the suite must find by itself: every run shuffles.
  "pytest-randomly>=3.16,<4",
  # The properties — a chunk never over the cap, a fusion blind to the order of its branches, a
  # snapshot that resumes to the state it was taken from — are stated once and searched for.
  "hypothesis>=6.140,<7",
  # Lints the .sql of a migration for what it does to a table that HAS rows: a lock held too
  # long, an index built while writes are blocked. `.squawk.toml` says which rules the runner
  # answers instead. Rust, shipped as a wheel, so it costs nothing at import time.
  "squawk-cli>=2.65,<3",
  # scripts/test measures branch coverage against the floor in [tool.coverage.report].
  "pytest-cov>=7,<8",
  # scripts/lint holds what the tree imports to what pyproject declares, both ways.
  "deptry>=0.24,<1",
  # The fakes, fixtures and plugins the suites share: a member of the workspace, never published.
  "pinecall-testkit",
]

[tool.uv.sources]
pinecall-testkit = { workspace = true }

# ── pytest ──────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
# No testpaths: every distribution names its suite `tests`, so each runs in its own process
# (scripts/unit, scripts/test). `uv run pytest <path>` runs the one it is given.
# `-p randomly` is named rather than left to the entry point: a virtualenv without the plugin
# fails at startup instead of quietly running the suite in file order.
# `-n auto` lives in scripts/test, not here: `uv run pytest tests/cli/doctor/test_verbs.py` used
# to spawn a worker per core for thirty tests.
addopts = "--tb=short -p randomly --strict-markers --strict-config"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A test that hangs fails in ten seconds, by itself. Nothing that honestly needs longer is a
# unit test, and a hang costs minutes only when it is allowed to last. A hypothesis search or a
# walk over every module marks its own minute (tests/conftest.py, SEARCH_S): the thread method
# kills the xdist worker at the limit, and a slow runner is not a hung test.
timeout = 10
timeout_method = "thread"
filterwarnings = [
  "error",
  # starlette.testclient asks for httpx2 at import time. The WebSocket tests need the TestClient
  # (httpx speaks no WebSocket at all) and the runtime pins httpx 0.x for everything else.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
markers = [
  "unit: ring 0. No keys, no network, under two minutes",
  "postgres: needs DATABASE_URL reachable — the compose dev stack",
  "needs_llm: calls a model. Skipped without ANTHROPIC_API_KEY",
  "voice: drives audio through a real session. Skipped without the runtime extra and keys",
  "evals: the judged suites, ring 1 and up",
]

# ── coverage ────────────────────────────────────────────────────────────────────

# Measured by scripts/test; the floor is where the unit ring alone stood when it was first
# measured (90.7 %, 2026-09-26) and moves up with a release, never down. Branch coverage, because
# a refusal that is never taken is exactly the line a suite forgets.
[tool.coverage.run]
branch = true
# Paths and not the package name: a namespace has one path per distribution.
source = [
  "packages/pinecall-core/src/pinecall",
  "packages/pinecall-db/src/pinecall",
  "packages/pinecall-runtime/src/pinecall",
  "packages/pinecall-settings/src/pinecall",
]
omit = ["packages/pinecall-runtime/src/pinecall/cli/gateway.py", "packages/pinecall-runtime/src/pinecall/cli/worker.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
fail_under = 90

# ── type checkers ───────────────────────────────────────────────────────────────

[tool.pyright]
include = ["packages"]
# Every distribution's source, so the namespace resolves whole wherever a portion sits.
extraPaths = [
  "packages/pinecall-core/src",
  "packages/pinecall-db/src",
  "packages/pinecall-runtime/src",
  "packages/pinecall-settings/src",
  "packages/pinecall-testkit/src",
]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportImplicitOverride = true

# Every suite is a package named `tests`: each is resolved from its own distribution's directory.
[[tool.pyright.executionEnvironments]]
root = "packages/pinecall-db"
extraPaths = [
  "packages/pinecall-core/src",
  "packages/pinecall-db/src",
  "packages/pinecall-runtime/src",
  "packages/pinecall-settings/src",
  "packages/pinecall-testkit/src",
]

[[tool.pyright.executionEnvironments]]
root = "packages/pinecall-runtime"
extraPaths = [
  "packages/pinecall-core/src",
  "packages/pinecall-db/src",
  "packages/pinecall-runtime/src",
  "packages/pinecall-settings/src",
  "packages/pinecall-testkit/src",
]

[[tool.pyright.executionEnvironments]]
root = "packages/pinecall-settings"
extraPaths = [
  "packages/pinecall-core/src",
  "packages/pinecall-db/src",
  "packages/pinecall-runtime/src",
  "packages/pinecall-settings/src",
  "packages/pinecall-testkit/src",
]

[[tool.pyright.executionEnvironments]]
root = "packages/pinecall-testkit"
extraPaths = [
  "packages/pinecall-core/src",
  "packages/pinecall-db/src",
  "packages/pinecall-runtime/src",
  "packages/pinecall-settings/src",
  "packages/pinecall-testkit/src",
]

[tool.mypy]
files = [
  "packages/pinecall-core/src",
  "packages/pinecall-db/src",
  "packages/pinecall-runtime/src",
  "packages/pinecall-settings/src",
]
mypy_path = "packages/pinecall-core/src:packages/pinecall-db/src:packages/pinecall-runtime/src:packages/pinecall-settings/src"
namespace_packages = true
explicit_package_bases = true
strict = true
python_version = "3.12"

# ── ruff ────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "packages/pinecall-core/src",
  "packages/pinecall-core/tests",
  "packages/pinecall-db/src",
  "packages/pinecall-db/tests",
  "packages/pinecall-runtime/src",
  "packages/pinecall-runtime/tests",
  "packages/pinecall-settings/src",
  "packages/pinecall-settings/tests",
  "packages/pinecall-testkit/src",
  "packages/pinecall-testkit/tests",
]

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "UP", "ARG", "T201", "FA102", "TC004", "TID251",
  # 2026-09-26: what the audit measured worth adopting — each one fired on something real.
  "RUF", "ASYNC", "SIM", "C4", "RET", "PIE", "PERF", "FURB", "ISC", "PGH", "LOG", "G", "T10", "S",
]
ignore = [
  # The tree writes `›` and `—` in its strings and comments, on purpose.
  "RUF001", "RUF002", "RUF003",
  # A sentence that names a token is not a token: every hit is a constant's name or a message.
  "S105", "S106",
  # Every f-string SQL here interpolates a column list or a table name of ours; a value is $n.
  "S608",
  # A `timeout` parameter is how this tree hands a budget in: the caller decides, by design.
  "ASYNC109",
  # A loop with an await inside it is not a comprehension.
  "PERF401",
]
unfixable = ["T201"]

[tool.ruff.lint.per-file-ignores]
# The CLI is the one place that speaks to a terminal.
"packages/pinecall-runtime/src/pinecall/cli/**" = ["T201"]
# And a maintainer's script, which is run by hand and has nowhere else to say what it wrote.
"scripts/*.py" = ["T201", "S310"]
# A test asserts, spawns the tree's own tools, and makes noise with `random`; so does the testkit
# every suite is built on.
"packages/*/tests/**" = ["S101", "S301", "S311", "S603", "S607"]
"packages/pinecall-testkit/src/**" = ["S101", "S301", "S311", "S603", "S607"]
"infra/tools/tests/**" = ["S101"]
# The operator's own Python: it opens fixed https URLs, binds a probe to every interface on
# purpose, and jitters a SIP call with `random`.
"infra/tools/**" = ["S310", "S104", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["pinecall", "pinecall_protocol", "pinecall_testkit", "tests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The environment is read once, in _settings.py. Everywhere else takes a Settings.
"os.environ".msg = "Read the environment through pinecall.settings, nowhere else."
"os.getenv".msg = "Read the environment through pinecall.settings, nowhere else."
