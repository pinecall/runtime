# One package, one distribution: the wheel is `pinecall-runtime`, its import `pinecall`, and the
# tools that keep it honest (tests/rules/) are configured here, once.

[project]
name = "pinecall-runtime"
version = "0.1.44"
description = "The Pinecall voice-AI runtime: gateway and worker, on LiveKit"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Bernardo Castro", email = "me@bernardocastro.dev" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Telephony",
]
dependencies = [
  # The text session is livekit's AgentSession with no audio: the library and its two llm plugins.
  "livekit-agents[anthropic,openai]>=1.8.3,<2",
  # Smart Turn v3, the row's alternative to livekit's own end-of-turn model: 8 MB of ONNX read
  # off the caller's audio on the worker's CPU, no transcript.
  "smart-turn-livekit[livekit]>=0.4,<1",
  # Room tokens are livekit's AccessToken; the id_token of an identity provider is read with PyJWT.
  "livekit-api>=1.2,<2",
  # A livekit client's room configuration is parsed with protobuf's own reader.
  "protobuf>=6,<8",
  "pyjwt[crypto]>=2.10,<3",
  # A call's recording: the room's other voices and the melody laid in (session/_recording.py).
  "av>=15,<19",
  "numpy>=2,<3",
  # Every sealed secret is a Fernet token; passwords are argon2id.
  "cryptography>=46,<51",
  "argon2-cffi>=25.1,<26",
  # A provider's discovery, keys and token endpoint.
  "httpx>=0.28,<1",
  # A worker's entries go to the gateway on one WebSocket per call.
  "websockets>=15,<16",
  # The gateway's doors and sockets; starlette's middleware and types are imported by name.
  "fastapi>=0.141,<1",
  "starlette>=1.7,<2",
  "uvicorn[standard]>=0.54,<1",
  # A worker's spans, where PINECALL_OTLP_ENDPOINT says.
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  # TypeIs reaches `typing` in 3.13; the box runs 3.12.
  "typing-extensions>=4.12,<5",
  "phonenumbers>=9,<10",
  # The live signal between gateways, when PINECALL_REDIS_URL names one: its asyncio client.
  "redis>=8.1,<9",
  "dnspython>=2.7,<3",
]

# Every livekit plugin that exports an STT, a TTS or an LLM is a vendor once installed; the box
# installs `voice`. The four whose SDKs weigh hundreds of megabytes are `voice-big`.
[project.optional-dependencies]
voice = [
  "livekit-agents[assemblyai,asyncai,baseten,bland,cambai,cartesia,cerebras,clova,deepgram,elevenlabs,fal,fireworksai,fishaudio,gladia,gnani,gradium,groq,hume,inworld,lmnt,meta,minimax,mistralai,murf,neuphonic,nvidia,palabra,perplexity,resemble,respeecher,rime,rtzr,sarvam,simplismart,slng,smallestai,soniox,speechify,spitch,upliftai,vakyam,xai]>=1.8.3,<2",
  # livekit-plugins-upliftai imports socketio and does not declare it (1.8.3): without it the
  # plugin does not import, and Uplift AI is no vendor.
  "python-socketio>=5.11,<6",
]
voice-big = ["livekit-agents[aws,azure,google,speechmatics]>=1.8.3,<2"]

[project.scripts]
pinecall-runtime = "pinecall.cli.main:main"

[project.urls]
Homepage = "https://github.com/pinecall/runtime"
Repository = "https://github.com/pinecall/runtime"

[dependency-groups]
dev = [
  "deptry>=0.25,<1",
  # The suites build the real plugins with fake keys; no request leaves the laptop.
  "pinecall-runtime[voice]",
  "pylint>=4,<5",
  "pyright>=1.1.414,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-timeout>=2.4,<3",
  # Every test has a schema of its own, so the suites run on every core.
  "pytest-xdist>=3.8,<4",
  "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pinecall"]

# scripts/hatch_build.py puts build/public (scripts/console) in the wheel as pinecall/public.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"

# ── pytest ──

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
filterwarnings = [
  "error",
  # A plugin's own import, not ours: clova's pydub imports audioop, gone in Python 3.13.
  "ignore:'audioop' is deprecated:DeprecationWarning",
  # pydub, the same plugin's: a regex in a plain string, warned when Python compiles it afresh.
  "ignore:invalid escape sequence:SyntaxWarning",
  # And pydub again, on a machine with no ffmpeg (CI's): the plugin never runs here.
  "ignore:Couldn't find ffmpeg or avconv:RuntimeWarning",
]
markers = [
  "postgres: needs DATABASE_URL, the local Postgres `make test` starts",
  "live: runs against the sandbox instance",
]

# ── the checkers (rule 10) ──

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/rules/fixtures"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",   # one of each incompatible pair; the Google convention keeps D211 and D212
  "D213",
  "COM812", # the formatter owns trailing commas
  "EM101",  # the sentence a person reads is written where it is raised
  "EM102",
  "TRY003",
  "N818",   # an error is named for what was refused, not with a suffix
  "D105",   # __post_init__ and the like: the class docstring says it
  "CPY001", # the LICENSE file is the notice
  "TC001",  # rule 3 forbids TYPE_CHECKING blocks: an import used in annotations alone stays one
  "TC002",
  "TC003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test's name is its sentence; asserts and literal numbers are what a test is made of.
"tests/**" = ["D103", "INP001", "PLR2004", "S101"]
"**/__init__.py" = ["D104"]  # rule 1: every __init__.py is empty
"tests/rules/**" = ["S603", "S607"]  # the rules run the checkers as subprocesses
"pinecall/cli/_local.py" = ["S603", "S607"]  # docker compose, and this package's own gateway and worker
"pinecall/process/recordings.py" = ["ARG002"]  # the disk answers the bucket's calls, and its paths name no org
"scripts/**" = ["INP001"]  # the build's tools, loaded by path: no package
"infra/lab/**" = ["INP001"]  # the voice lab's tools, run by path: no package
"infra/lab/measure.py" = ["T201", "S108", "S310", "S603", "S607", "S608", "ANN401"]  # prints its table; /tmp is the generator's; https to the gateway; gcloud, kubectl, terraform; queries of its own clock; the doors' JSON
# A fake plugin takes the arguments a real one does, and its keys are fakes; livekit's
# RoomService names its request `list`, and an override keeps the name it overrides.
"tests/fakes/*.py" = ["PLR0913", "S105", "S106", "A002"]

[tool.ruff.lint.isort]
known-first-party = ["pinecall", "tests"]

[tool.pyright]
include = ["pinecall", "tests"]
exclude = ["tests/rules/fixtures"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportImplicitOverride = true

[tool.deptry]
known_first_party = ["pinecall", "tests"]
# The voice lab runs on a machine of its own with what `uv run --with` gives it, not the package's.
extend_exclude = ["tests/rules/fixtures", "infra/lab"]
# The wheel's build hook imports the build backend, which build-system.requires declares.
# python-socketio is a plugin's import, never ours (the voice extra says why).
per_rule_ignores = { DEP001 = ["hatchling"], DEP002 = ["python-socketio"] }

[tool.vibesmell]
# Calling these is the effect a door exists for: its hops are counted up to them.
sinks = ["log.logs:Log.append", "Twilio._get", "providers.build:installed"]
# The folders from the bottom up, as the imports stand today: one may import only from those before it.
layers = ["domain", "postgres", "wire", "process", "log", "fleet", "runner", "providers", "tenancy", "retrieval", "session", "channels", "evals", "worker", "gateway", "cli"]

# Every skip below is a finding read and kept on purpose; vibesmell prints each why on every run.
[[tool.vibesmell.skip]]
path = "pinecall/domain/call.py"
checks = ["unread_field"]
why = "the domain's Contact mirrors the wire's field by field, and tests/domain/test_names.py holds it so"

[[tool.vibesmell.skip]]
path = "pinecall/tenancy/scopes.py"
checks = ["clump"]
why = "pool first, then whose: the shape of every tenancy module's functions, not an object waiting to be written"

[[tool.vibesmell.skip]]
path = "pinecall/gateway/api/judges.py"
checks = ["clump"]
why = "pool, org, agent is the tenancy call every door family makes; one object here and not in the others reads worse"

[[tool.vibesmell.skip]]
path = "pinecall/fleet/client.py"
checks = ["clump"]
why = "method, path, body and timeout are httpx.request's own arguments, handed to it"

[[tool.vibesmell.skip]]
path = "pinecall/**"
checks = ["scattered_api"]
why = "psycopg's Jsonb is how a JSON column is written; a function of ours around it would be a pass-through (rule 2)"

[[tool.vibesmell.skip]]
path = "pinecall/gateway/_deps.py"
checks = ["hub"]
why = "each request's dependencies: every door takes the few it needs, which is what the module is for"

[[tool.vibesmell.skip]]
path = "pinecall/session/call.py"
checks = ["hub"]
why = "the Call every part of a session shares; each reads the part of it that is its own"

[[tool.vibesmell.skip]]
path = "pinecall/channels/telephony/dialing.py"
checks = ["tunnel"]
why = "the world is what the door knows; the box's name is read where a Twilio trunk needs it, and a SIP peer never does"

[[tool.vibesmell.skip]]
path = "pinecall/gateway/_gateway.py"
checks = ["unstable_dependency"]
why = "Gateway is the process's state: it holds each part, the WhatsApp threads among them"

[[tool.vibesmell.skip]]
path = "pinecall/log/store.py"
checks = ["unstable_dependency"]
why = "the writer is the store's own write half (log/_writer.py), split out as the queue that outlives a request; nothing else reaches it"

[[tool.vibesmell.skip]]
path = "pinecall/gateway/_sockets.py"
checks = ["forward"]
why = "calls_from is a phone's verb (api/line.py calls it through gateway.sockets, which vibesmell does not follow); _assigned is the write lines and phones share, its table the registry's own"

[[tool.vibesmell.skip]]
path = "pinecall/session/session.py"
checks = ["hub"]
why = "the Session class and the sentences it says; every importer takes the class, and its sentences are not another module"

[[tool.vibesmell.skip]]
path = "pinecall/wire/events.py"
checks = ["hub"]
why = "the log's vocabulary: every event and the registry that reads them back, as docs/wire/events.md lists them; each writer takes the few it writes"

[[tool.vibesmell.skip]]
path = "pinecall/wire/rest/*.py"
checks = ["shotgun"]
why = "a door's body is the wire's (pinned by the goldens, read by the CLI and the SDKs) and its handler the gateway's: a door that changes changes both, on purpose"

[[tool.vibesmell.skip]]
path = "pinecall/session/call.py"
checks = ["shotgun"]
why = "the worker's job builds the Call a session runs on: what a voice call is given at its start (its recording, its writer) lands in both; two of the five are a feature and its revert"

[[tool.vibesmell.skip]]
path = "pinecall/worker/_recorder.py"
checks = ["shotgun"]
why = "the seam is cut: where a call's file lives is process/recordings.py alone (recording_path, call_directory), and the recorder only seals and stores it; the five co-commits are history, a feature and its revert among them"
