# The runtime's image, built by Cloud Build from the context `make image-v2` prepares (the wheel
# beside the Containerfile), checked before it is pushed: the package answers, every installed
# voice plugin imports for livekit's preload, and Smart Turn's weights are on the image offline.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Containerfile", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["run", "--rm", "${_IMAGE}", "--version"]
  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint
      - python
      - ${_IMAGE}
      - -c
      - >-
        from pinecall.providers.build import installed; installed();
        from smart_turn_livekit.models import resolve_model;
        print(resolve_model('smart-turn-v3', local_only=True))
images:
  - "${_IMAGE}"
options:
  logging: CLOUD_LOGGING_ONLY
