# A cluster's Postgres, released before charts/pinecall (`make deploy`): the runtime's migrations
# need it up. The world-pair's own values (infra/values/<env>.yaml) name the bucket and identity.
# Secret Manager, read through a store of this chart's own (`pinecall-postgres`), since this chart
# is released before charts/pinecall's: the gateway's role's password is drawn there
# (terraform/modules/secrets, postgres-app-password). The same values charts/pinecall is given.
secrets:
  project: ""
  prefix: ""
  refresh: 1h
postgres:
  # The role the gateway connects as: every table's rows, granted by `migrate up`, no table's shape.
  # The owner (initdb's) keeps running the migrations and the nightly retention, which makes days.
  appRole: pinecall_app
  appSecret: pinecall-postgres-runtime
  # images/postgres, built by Cloud Build: CloudNativePG's operand with pg_textsearch on it, in the
  # project's registry (infra/values/<env>.yaml).
  image: ""
  instances: 1
  size: 20Gi
  backups:
    # terraform/modules/backups' outputs.
    bucket: ""
    serviceAccount: ""
    # What the plugin keeps: base backups and the WAL to restore to any minute inside it.
    retention: 35d
    # A base backup a night, at the hour with fewest calls (UTC).
    schedule: "0 0 3 * * *"
