# The cluster's Postgres under CloudNativePG. pg_textsearch keeps BM25 statistics in shared memory,
# so it is preloaded by the operator's own setting; the two extensions are made once, at initdb, by
# the superuser, as local/postgres/extensions.sql does on a laptop (the migrations make none). Its
# WAL goes to the bucket as it is written and a base backup each night, by the Barman Cloud plugin,
# as the identity terraform/modules/backups made: a restore reaches any minute of the window.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pinecall-postgres
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ required "postgres.image" .Values.postgres.image }}
  # No superuser secret: initdb makes the two extensions as postgres whatever this says
  # (postInitTemplateSQL), the application connects as the database's owner, and an operator's
  # psql goes through `kubectl exec` as the pod's own postgres, by peer.
  enableSuperuserAccess: false
  # One instance: a stop waits 15 s for the gateways' pooled sessions, not the default 180, during
  # which no new connection opens (measured on staging, 2026-10-03: three minutes without one).
  smartShutdownTimeout: 15
  postgresql:
    shared_preload_libraries:
      - pg_textsearch
  bootstrap:
    initdb:
      database: pinecall
      owner: pinecall
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pg_textsearch
  # The gateway's role, made and kept by the operator from its secret below; what it may do is
  # granted by the runtime's own `migrate up` (PINECALL_DB_APP_ROLE), each release.
  managed:
    roles:
      - name: {{ .Values.postgres.appRole }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ .Values.postgres.appSecret }}
  storage:
    size: {{ .Values.postgres.size }}
    storageClass: standard-rwo
  serviceAccountTemplate:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: {{ required "postgres.backups.serviceAccount" .Values.postgres.backups.serviceAccount | quote }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pinecall-postgres
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pinecall-postgres
spec:
  retentionPolicy: {{ .Values.postgres.backups.retention | quote }}
  configuration:
    destinationPath: {{ printf "gs://%s/postgres" (required "postgres.backups.bucket" .Values.postgres.backups.bucket) | quote }}
    googleCredentials:
      gkeEnvironment: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pinecall-postgres
spec:
  schedule: {{ .Values.postgres.backups.schedule | quote }}
  # No first backup at install: it would run before the plugin is in the Postgres pod, and fail.
  # A database restored or written to for the first time is backed up by hand (infra/README.md).
  backupOwnerReference: self
  cluster:
    name: pinecall-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: pinecall-postgres
---
# The gateway's role's password, from Secret Manager, as CloudNativePG reads a managed role's
# (basic-auth: username, password) and with the URI the gateway connects by beside it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.appSecret }}
spec:
  refreshInterval: {{ .Values.secrets.refresh }}
  secretStoreRef: { kind: ClusterSecretStore, name: pinecall }
  target:
    name: {{ .Values.postgres.appSecret }}
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.postgres.appRole }}
        password: "{{`{{ .password }}`}}"
        uri: "postgresql://{{ .Values.postgres.appRole }}:{{`{{ .password }}`}}@pinecall-postgres-rw:5432/pinecall"
  data:
    - secretKey: password
      remoteRef: { key: {{ printf "%spostgres-app-password" .Values.secrets.prefix | quote }} }
