# The runtime's image: the runner is `pinecall-runtime runner start`. The tag is the commit,
# given by `make hosting`.
image:
  repository: us-central1-docker.pkg.dev/example-project/pinecall/runtime
  tag: ""
# The box the runners serve, by its public name: the hosting cluster is not the box's.
gatewayUrl: https://cloud.pinecall.io
project: ""
# modules/secrets' prefix: each world's runner key is <prefix>runner-key-<world>.
secretPrefix: ""
# modules/hosting's runner identity, the one that reads those keys and nothing else.
serviceAccount: ""
# Every hosted app's image, and the runtime class its pod runs under (GKE Sandbox's gVisor).
appImage: docker.io/library/node:24-slim
runtimeClass: gvisor
appsNamespace: pinecall-apps
# A world's runner serves its releases' sources at a fixed address of the services range: an
# app's pod resolves nothing of the cluster's (public resolvers only), so it reaches it by address.
worlds:
  production: { address: 10.132.0.10 }
  sandbox: { address: 10.132.0.11 }
