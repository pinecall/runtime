# The box's alerts, once, as a Prometheus rule file: whatever evaluates them reads these. On a
# cluster with the Prometheus Operator, charts/pinecall carries them as its PrometheusRule
# (`monitoring.collector: prometheus-operator`); on Google Cloud, terraform/modules/alerts makes a
# Cloud Monitoring policy of each. `$cluster` stands for the cluster's own selector and its comma:
# nothing where one Prometheus watches one cluster, `cluster="pinecall-<env>",` where one project
# holds several. Durations in seconds, as both read them.
groups:
  - name: pinecall
    rules:
      # A write that waits is every call waiting: the log is on the path of every entry.
      - alert: appends slow
        expr: histogram_quantile(0.99, sum by (le) (rate(pinecall_append_seconds_bucket{$cluster}[5m]))) > 0.25
        for: 300s
        annotations:
          summary: "Appends take over 250 ms at p99: the database is the calls' bottleneck."
      # Busy past 0.8 for five minutes and the burst has not caught up: new calls hear the overflow.
      - alert: fleet busy
        expr: sum by (fleet) (pinecall_fleet{$cluster what="busy"}) / sum by (fleet) (pinecall_fleet{$cluster what="seats"}) > 0.8
        for: 300s
        annotations:
          summary: "A fleet is over 80 % busy: new calls are about to hear the overflow."
      # A vendor over its error line: its calls are being stepped over to the fallbacks.
      - alert: vendor failing
        expr: max by (vendor) (pinecall_vendor_failing{$cluster}) == 1
        for: 120s
        annotations:
          summary: "A vendor fails half the calls handed it: they go to its fallbacks."
      # No gateway answers its collector: every door, every call's log, the console.
      - alert: gateways down
        expr: absent(up{$cluster job="pinecall-gateway"} == 1)
        for: 120s
        annotations:
          summary: "No gateway answers: the doors and every call's log are down."
      # A gateway's reaper or sweep stopped on an error it does not catch: unsealed calls count
      # against their org's limit, or rooms nobody opened are never offered again.
      - alert: a gateway's loop stopped
        expr: min by (loop) (pinecall_loop_running{$cluster}) == 0
        for: 120s
        annotations:
          summary: "A gateway's reaper or sweep has stopped: restart that gateway (kubectl rollout restart deploy/pinecall-gateway) and read its log for why."
      # Postgres does not answer its own exporter (CloudNativePG's, charts/postgres), or is gone.
      - alert: postgres down
        expr: absent(cnpg_collector_up{$cluster} == 1)
        for: 120s
        annotations:
          summary: "Postgres does not answer: every gateway's writes wait, then fail."
      # The archiver's last attempt failed (the -1 of a WAL that never failed is left out): the
      # bucket holds no new WAL, so a restore reaches no further than the last one that went.
      - alert: WAL not archived
        expr: (cnpg_pg_stat_archiver_seconds_since_last_failure{$cluster} >= 0) < cnpg_pg_stat_archiver_seconds_since_last_archival{$cluster}
        for: 900s
        annotations:
          summary: "Postgres has failed to archive its WAL for 15 minutes: the backups stop at the last segment that went, and the disk fills with the rest."
