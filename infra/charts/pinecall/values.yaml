# One release per world-pair: production and sandbox share a cluster, one gateway and one database.

image:
  repository: us-central1-docker.pkg.dev/hiding-place-447317-c6/pinecall/runtime
  tag: ""

# The two names a request comes in by: the world is the name (docs/multi-tenancy.md).
domains:
  production: ""
  sandbox: ""

fleets:
  production: pinecall
  sandbox: pinecall-sandbox

# Secret Manager, synced by External Secrets Operator (terraform/modules/secrets).
secrets:
  project: ""
  prefix: ""
  refresh: 1h

# CloudNativePG's application secret of the cluster's Postgres (charts/postgres).
postgres:
  secret: pinecall-postgres-app

media:
  livekit: docker.io/livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
  sip: docker.io/livekit/sip:v1.17.0@sha256:d3c6441eb0918a81ab9e48ba7df6f02c1eebbeace42c963b2c6a6e5418675671
  redis: docker.io/library/redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
  kubectl: registry.k8s.io/kubectl:v1.35.0
  kubeip: docker.io/doitintl/kubeip-agent:2.2.1@sha256:a0e4bc33b2027644bd952042e913453365caf2a69179a06482c1ad2673983749
  rtpPorts: 10000-10199
  # The nodes' subnet (terraform/modules/gke): LiveKit on the node's network sees GKE's virtual
  # interfaces too (the pods' bridge, the DNS cache's address) and takes its port on these alone.
  nodeNetwork: 10.110.0.0/22

gateway:
  replicas: 2
  # Google's load balancers and health checkers: the only X-Forwarded-For believed.
  trustedProxies: 35.191.0.0/16,130.211.0.0/22
  # The cluster's pods: /metrics answers them (a forwarded request never).
  podNetwork: 10.111.0.0/16

# Each world's workers on the core node, and the ones KEDA scales on the workers pool from 0 on the
# gateway's own number (GET /v1/ops/fleet/{fleet}/wanted).
workers:
  core:
    production: { replicas: 2, seats: 2 }
    sandbox: { replicas: 2, seats: 1 }
  scaled:
    production: { seats: 32, most: 10 }

# The core node's static address (terraform/modules/edge, core_address): kubeip gives it to the
# node, as the identity terraform/modules/kubeip made, by the address's label (`filter`, gcloud's
# syntax), and LiveKit and SIP announce it. Unset, they announce the node's ephemeral address.
core:
  address: ""
  filter: ""
  kubeip: ""

# The names a carrier sends each world's calls to (PINECALL_SIP_DOMAIN): the core node's address,
# since the worlds' names are Google's HTTPS load balancer, which carries no SIP. Unset, the names.
sipDomains:
  production: ""
  sandbox: ""

# The object store a finished recording moves to (docs/the-environment.md): unset, recordings stay
# on the pod's disk and go with it. Its secret is the world's `s3-secret-access-key` in Secret
# Manager, put by the operator (terraform/modules/secrets, `given`).
store:
  endpoint: ""
  region: ""
  accessKeyId: ""
  bucket: ""

overflow:
  says: ""

ingress:
  # A global address Terraform reserves; the managed certificate covers both names.
  address: ""
