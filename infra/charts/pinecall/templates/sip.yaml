# livekit-sip on the core node's own network: 5060 and the RTP ports are the node's (the firewall,
# by Terraform, opens them); LiveKit publishes no chart for it, so it is this one. Its config holds
# the API pair and Redis's password: a Secret (secrets.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinecall-sip
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: pinecall-sip } }
  template:
    metadata:
      labels: { app: pinecall-sip }
      # One instance holds every call, so a release never restarts it on its own: its config, the
      # Secret External Secrets writes, is read at start and applied by `kubectl rollout restart`
      # at an hour with no call; a new image is the same (on staging, 2026-10-03, a release that
      # rolled both restarted them with sixteen calls up).
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: { pinecall.io/pool: core }
      terminationGracePeriodSeconds: 600
      containers:
        - name: sip
          image: {{ .Values.media.sip }}
          args: ["--config", "/sip/config.yaml"]
          readinessProbe:
            httpGet: { path: /, port: 8081 }
          volumeMounts:
            - { name: config, mountPath: /sip, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
      volumes:
        - name: config
          secret:
            secretName: pinecall-media
            items: [{ key: sip.yaml, path: config.yaml }]
