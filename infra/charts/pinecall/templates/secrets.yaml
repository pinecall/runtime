# Secret Manager into the cluster: the runtime's environment, and LiveKit's and SIP's whole config
# files, which carry the Redis password and the API pair and so are Secrets, never ConfigMaps.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: pinecall
spec:
  provider:
    gcpsm:
      projectID: {{ required "secrets.project" .Values.secrets.project | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pinecall
spec:
  refreshInterval: {{ .Values.secrets.refresh }}
  secretStoreRef: { kind: ClusterSecretStore, name: pinecall }
  target:
    name: pinecall
    template:
      data:
        PINECALL_VAULT_KEY: "{{`{{ .vault }}`}}"
        PINECALL_OPS_KEY: "{{`{{ .ops }}`}}"
        LIVEKIT_API_KEY: "{{`{{ .livekitKey }}`}}"
        LIVEKIT_API_SECRET: "{{`{{ .livekitSecret }}`}}"
        REDIS_PASSWORD: "{{`{{ .redis }}`}}"
        PINECALL_REDIS_URL: "redis://:{{`{{ .redis }}`}}@pinecall-redis:6379/1"
  data:
    {{- range $key, $name := dict "vault" "vault-key" "ops" "ops-key" "livekitKey" "livekit-api-key" "livekitSecret" "livekit-api-secret" "redis" "redis-password" }}
    - secretKey: {{ $key }}
      remoteRef: { key: {{ printf "%s%s" $.Values.secrets.prefix $name | quote }} }
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pinecall-media
spec:
  refreshInterval: {{ .Values.secrets.refresh }}
  secretStoreRef: { kind: ClusterSecretStore, name: pinecall }
  target:
    name: pinecall-media
    template:
      data:
        # LiveKit's own file, its webhook to the gateways' Service inside the cluster.
        livekit.yaml: |
          port: 7880
          keys:
            "{{`{{ .livekitKey }}`}}": "{{`{{ .livekitSecret }}`}}"
          rtc:
            use_external_ip: true
            udp_port: 7882
            tcp_port: 7881
            ips:
              includes:
                - {{ .Values.media.nodeNetwork }}
          redis:
            address: pinecall-redis:6379
            password: "{{`{{ .redis }}`}}"
          room:
            auto_create: true
            empty_timeout: 60
          logging:
            level: info
          webhook:
            api_key: "{{`{{ .livekitKey }}`}}"
            urls:
              - http://pinecall-gateway:8080/v1/livekit/webhook
        # livekit-sip's own file.
        sip.yaml: |
          api_key: "{{`{{ .livekitKey }}`}}"
          api_secret: "{{`{{ .livekitSecret }}`}}"
          ws_url: ws://pinecall-livekit:7880
          redis:
            address: pinecall-redis:6379
            password: "{{`{{ .redis }}`}}"
          sip_port: 5060
          rtp_port: {{ .Values.media.rtpPorts }}
          use_external_ip: true
          # On the node's network SIP would take a GKE interface (169.254.169.252) for its own
          # address: the nodes' subnet names the right one, as LiveKit's rtc.ips does.
          local_net: {{ .Values.media.nodeNetwork }}
          hide_inbound_port: true
          health_port: 8081
          log_level: info
  data:
    {{- range $key, $name := dict "livekitKey" "livekit-api-key" "livekitSecret" "livekit-api-secret" "redis" "redis-password" }}
    - secretKey: {{ $key }}
      remoteRef: { key: {{ printf "%s%s" $.Values.secrets.prefix $name | quote }} }
    {{- end }}
