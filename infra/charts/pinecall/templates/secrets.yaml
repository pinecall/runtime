# Secret Manager into the cluster: the runtime's environment, and each world's LiveKit's and SIP's
# whole config files, which carry the Redis password and the API pair and so are Secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: pinecall
spec:
  provider:
    gcpsm:
      projectID: {{ required "secrets.project" .Values.secrets.project | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pinecall
spec:
  refreshInterval: {{ .Values.secrets.refresh }}
  secretStoreRef: { kind: ClusterSecretStore, name: pinecall }
  target:
    name: pinecall
    template:
      data:
        PINECALL_VAULT_KEY: "{{`{{ .vault }}`}}"
        PINECALL_OPS_KEY: "{{`{{ .ops }}`}}"
        PINECALL_TOKEN_KEY: "{{`{{ .token }}`}}"
        LIVEKIT_API_KEY: "{{`{{ .livekitKey }}`}}"
        LIVEKIT_API_SECRET: "{{`{{ .livekitSecret }}`}}"
        REDIS_PASSWORD: "{{`{{ .redis }}`}}"
        PINECALL_REDIS_URL: "redis://:{{`{{ .redis }}`}}@pinecall-redis:6379/1"
        {{- if .Values.store.bucket }}
        PINECALL_S3_ACCESS_KEY_ID: "{{`{{ .s3KeyId }}`}}"
        PINECALL_S3_SECRET_ACCESS_KEY: "{{`{{ .s3Secret }}`}}"
        {{- end }}
  data:
    {{- $named := dict "vault" "vault-key" "ops" "ops-key" "token" "token-key" "livekitKey" "livekit-api-key" "livekitSecret" "livekit-api-secret" "redis" "redis-password" }}
    {{- if .Values.store.bucket }}
    {{- $_ := set $named "s3KeyId" "s3-access-key-id" }}
    {{- $_ := set $named "s3Secret" "s3-secret-access-key" }}
    {{- end }}
    {{- range $key, $name := $named }}
    - secretKey: {{ $key }}
      remoteRef: { key: {{ printf "%s%s" $.Values.secrets.prefix $name | quote }} }
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pinecall-media
spec:
  refreshInterval: {{ .Values.secrets.refresh }}
  secretStoreRef: { kind: ClusterSecretStore, name: pinecall }
  target:
    name: pinecall-media
    template:
      data:
        {{- range $world, $fleet := .Values.fleets }}
        {{- $address := index $.Values.media.addresses $world }}
        # The world's LiveKit: its webhook to the gateways' Service inside the cluster, naming
        # the world, and the world's own Redis.
        livekit-{{ $world }}.yaml: |
          port: 7880
          keys:
            "{{`{{ .livekitKey }}`}}": "{{`{{ .livekitSecret }}`}}"
          rtc:
            {{- if $address }}
            # The world's media address (kubeip), told rather than asked of STUN at start: a node
            # that started before kubeip gave it the address would announce the old one.
            node_ip: {{ $address }}
            {{- else }}
            use_external_ip: true
            {{- end }}
            udp_port: 7882
            tcp_port: 7881
            ips:
              includes:
                - {{ $.Values.media.nodeNetwork }}
          redis:
            address: pinecall-redis-{{ $world }}:6379
            password: "{{`{{ .redis }}`}}"
          room:
            auto_create: true
            empty_timeout: 60
          logging:
            level: info
          webhook:
            api_key: "{{`{{ .livekitKey }}`}}"
            urls:
              - http://pinecall-gateway:8080/v1/livekit/webhook?world={{ $world }}
        # The world's livekit-sip, on its LiveKit's Redis.
        sip-{{ $world }}.yaml: |
          api_key: "{{`{{ .livekitKey }}`}}"
          api_secret: "{{`{{ .livekitSecret }}`}}"
          ws_url: ws://pinecall-livekit-{{ $world }}:7880
          redis:
            address: pinecall-redis-{{ $world }}:6379
            password: "{{`{{ .redis }}`}}"
          sip_port: 5060
          rtp_port: {{ $.Values.media.rtpPorts }}
          {{- if $address }}
          # The world's media address, in its Contact and its SDP alike (as LiveKit's node_ip).
          nat_1_to_1_ip: {{ $address }}
          media_nat_1_to_1_ip: {{ $address }}
          {{- else }}
          use_external_ip: true
          {{- end }}
          # On the node's network SIP would take a GKE interface (169.254.169.252) for its own
          # address: the nodes' subnet names the right one, as LiveKit's rtc.ips does.
          local_net: {{ $.Values.media.nodeNetwork }}
          hide_inbound_port: true
          health_port: 8081
          log_level: info
        {{- end }}
  data:
    {{- range $key, $name := dict "livekitKey" "livekit-api-key" "livekitSecret" "livekit-api-secret" "redis" "redis-password" }}
    - secretKey: {{ $key }}
      remoteRef: { key: {{ printf "%s%s" $.Values.secrets.prefix $name | quote }} }
    {{- end }}
