# The two names on one global address Terraform reserves, with Google's managed certificate; plain
# HTTP sent to HTTPS. LiveKit's signalling paths go to LiveKit, everything else to the gateways, as
# v1's Caddy routed them; a socket lives up to an hour on either (an app's, a room's).
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: pinecall
spec:
  domains:
    - {{ .Values.domains.production }}
    - {{ .Values.domains.sandbox }}
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: pinecall
spec:
  redirectToHttps:
    enabled: true
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: pinecall-gateway
spec:
  timeoutSec: 3600
  connectionDraining: { drainingTimeoutSec: 60 }
  healthCheck: { type: HTTP, requestPath: /, port: 8080 }
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: pinecall-livekit
spec:
  timeoutSec: 3600
  connectionDraining: { drainingTimeoutSec: 60 }
  healthCheck: { type: HTTP, requestPath: /, port: 7880 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pinecall
  annotations:
    # GKE's controller reads the class from this annotation alone and skips an Ingress that
    # names one in spec.ingressClassName, without an event.
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: {{ required "ingress.address" .Values.ingress.address | quote }}
    networking.gke.io/managed-certificates: pinecall
    networking.gke.io/v1beta1.FrontendConfig: pinecall
spec:
  defaultBackend:
    service: { name: pinecall-gateway, port: { number: 8080 } }
  rules:
    {{- range list .Values.domains.production .Values.domains.sandbox }}
    - host: {{ . }}
      http:
        paths:
          {{- range list "/rtc" "/twirp" "/validate" "/agent" }}
          - path: {{ . }}
            pathType: Prefix
            backend: { service: { name: pinecall-livekit, port: { number: 7880 } } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend: { service: { name: pinecall-gateway, port: { number: 8080 } } }
    {{- end }}
