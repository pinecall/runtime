# The gateways: as many as it takes, any one serving any call (their state is Postgres and Redis),
# on the pod's network behind the cluster's load balancer, whose X-Forwarded-For alone they believe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinecall-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector: { matchLabels: { app: pinecall-gateway } }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata: { labels: { app: pinecall-gateway } }
    spec:
      nodeSelector: { pinecall.io/pool: core }
      # A stopping gateway first serves on for 30 s, while the load balancer lets go of it (its
      # network endpoint leaves the group in seconds, not at once: told nothing, it answers 503 to
      # whoever it still sends there); then it tells its open streams and lets them go, in 60 s.
      terminationGracePeriodSeconds: 90
      containers:
        - name: gateway
          image: {{ include "pinecall.image" . }}
          args: ["gateway"]
          env:
            {{- include "pinecall.env" . | nindent 12 }}
            {{- include "pinecall.livekits" . | nindent 12 }}
            - name: PINECALL_GATEWAY_LISTEN
              value: 0.0.0.0:8080
            - name: PINECALL_TRUSTED_PROXIES
              value: {{ .Values.gateway.trustedProxies | quote }}
            - name: PINECALL_METRICS_FROM
              value: {{ printf "127.0.0.1,::1,%s" .Values.gateway.podNetwork | quote }}
            {{- with .Values.billingUrl }}
            - name: PINECALL_BILLING_URL
              value: {{ . | quote }}
            {{- end }}
          ports: [{ name: http, containerPort: 8080 }]
          lifecycle:
            preStop: { sleep: { seconds: 30 } }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 30
          volumeMounts:
            - { name: recordings, mountPath: /var/lib/pinecall/recordings }
          resources:
            requests: { cpu: 150m, memory: 384Mi }
      volumes:
        - { name: recordings, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: pinecall-gateway
spec:
  selector: { app: pinecall-gateway }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pinecall-gateway
spec:
  minAvailable: 1
  selector: { matchLabels: { app: pinecall-gateway } }
