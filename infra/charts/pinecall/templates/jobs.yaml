# The schema before anything new runs; the fleets' keys once, at install; the nightly retention.
# The doctor is not a hook yet: its `archive` line reads the box's WAL spool through Postgres, which
# a cluster's Postgres (CloudNativePG, no superuser) has not; that line is a decision of v1's.
apiVersion: batch/v1
kind: Job
metadata:
  name: pinecall-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata: { labels: { pinecall.io/reaches-postgres: "true" } }
    spec:
      restartPolicy: Never
      {{- include "pinecall.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "pinecall.image" . }}
          args: ["migrate", "up"]
          {{- include "pinecall.containerSecurity" . | nindent 10 }}
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.secret }}, key: uri } }
            # Granted every table's rows after the migrations, each release: the gateway's role.
            - name: PINECALL_DB_APP_ROLE
              value: {{ .Values.postgres.appRole | quote }}
          volumeMounts:
            {{- include "pinecall.scratchMounts" . | nindent 12 }}
      volumes:
        {{- include "pinecall.scratchVolumes" . | nindent 8 }}
---
# A worker knocks on the gateway with its world's fleet key, minted in the database by the runtime
# itself; the Job writes them into a Secret once, at install, before any worker starts, and it
# may create that Secret and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pinecall-fleet-keys
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pinecall-fleet-keys
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  # A secret an earlier install left holds keys the database it is installed on never minted.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [pinecall-fleet-keys]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pinecall-fleet-keys
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: pinecall-fleet-keys }
subjects: [{ kind: ServiceAccount, name: pinecall-fleet-keys }]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pinecall-fleet-keys
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata: { labels: { pinecall.io/reaches-postgres: "true" } }
    spec:
      restartPolicy: Never
      serviceAccountName: pinecall-fleet-keys
      initContainers:
        - name: forget
          image: {{ .Values.media.kubectl }}
          args: ["delete", "secret", "pinecall-fleet-keys", "--ignore-not-found"]
        - name: mint
          image: {{ include "pinecall.image" . }}
          command: ["sh", "-c", "umask 077 && pinecall-runtime keys fleet production > /keys/production && pinecall-runtime keys fleet sandbox > /keys/sandbox"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.secret }}, key: uri } }
          volumeMounts: [{ name: keys, mountPath: /keys }]
      containers:
        - name: secret
          image: {{ .Values.media.kubectl }}
          args: ["create", "secret", "generic", "pinecall-fleet-keys", "--from-file=/keys/production", "--from-file=/keys/sandbox"]
          volumeMounts: [{ name: keys, mountPath: /keys, readOnly: true }]
      volumes:
        - { name: keys, emptyDir: { medium: Memory } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pinecall-retention
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata: { labels: { pinecall.io/reaches-postgres: "true" } }
        spec:
          restartPolicy: Never
          nodeSelector: { pinecall.io/pool: core }
          {{- include "pinecall.podSecurity" . | nindent 10 }}
          containers:
            - name: retention
              image: {{ include "pinecall.image" . }}
              args: ["retention", "run"]
              {{- include "pinecall.containerSecurity" . | nindent 14 }}
              env:
                {{- include "pinecall.retentionEnv" . | nindent 16 }}
              volumeMounts:
                {{- include "pinecall.scratchMounts" . | nindent 16 }}
          volumes:
            {{- include "pinecall.scratchVolumes" . | nindent 12 }}
