# A cluster's front door, released apart from the runtime (`make deploy` releases it first): its
# load balancer takes minutes to make, so it stands before the runtime is installed, and a
# reinstall of the runtime never makes it again. The world-pair's values file names the name.
domain: ""

ingress:
  # The global address and the certificate map Terraform makes (modules/edge's outputs): the map's
  # certificate, proved by DNS, is valid before a name points at the address.
  address: ""
  certificateMap: ""
