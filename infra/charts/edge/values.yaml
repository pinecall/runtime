# A cluster's front door, released apart from the runtime (`make deploy` releases it first): its
# load balancer takes minutes to make, so it stands before the runtime is installed, and a
# reinstall of the runtime never makes it again. The operator's values file names the name.
domain: ""

# The Gateway API's Gateway, as the cluster's implementation takes it. On GKE (modules/edge's
# outputs): className `gke-l7-global-external-managed`, the annotation
# `networking.gke.io/certmap: <certificate map>` (its certificate, proved by DNS, is valid before
# a name points at the address) and the address `{ type: NamedAddress, value: <global address> }`.
# Elsewhere, that implementation's class, its annotations, and its addresses or none.
ingress:
  className: ""
  annotations: {}
  addresses: []
  # GKE's own policies on each backend: a socket lives up to an hour (an app's, a room's) and a
  # backend's health is read at its own port. Another implementation says the same its own way.
  gkePolicies: false
