# The one name on the cluster's load balancer through the Gateway API (values.yaml, `ingress`: on
# GKE, the global address and Certificate Manager's certificate of modules/edge); plain HTTP sent
# to HTTPS.
# LiveKit's signalling paths go to production's LiveKit, the same paths under /sandbox to the
# sandbox's with the prefix taken off, everything else to the gateways; a socket lives up to an
# hour on any of them (an app's, a room's). A browser's paths alone: LiveKit's API (/twirp) and its
# workers' registration (/agent) are reached inside the cluster by the gateways and the workers
# (LIVEKIT_URL), and from the internet they would answer anyone who held the API pair.
{{- $paths := list "/rtc" "/validate" }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pinecall
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ required "ingress.className" .Values.ingress.className }}
  {{- with .Values.ingress.addresses }}
  addresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  listeners:
    - { name: https, protocol: HTTPS, port: 443 }
    - { name: http, protocol: HTTP, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pinecall
spec:
  parentRefs: [{ name: pinecall, sectionName: https }]
  hostnames:
    - {{ required "domain" .Values.domain | quote }}
  rules:
    - matches:
        {{- range $paths }}
        - path: { type: PathPrefix, value: {{ . }} }
        {{- end }}
      backendRefs: [{ name: pinecall-livekit-production, port: 7880 }]
    {{- range $paths }}
    - matches: [{ path: { type: PathPrefix, value: /sandbox{{ . }} } }]
      filters:
        - type: URLRewrite
          urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: {{ . }} } }
      backendRefs: [{ name: pinecall-livekit-sandbox, port: 7880 }]
    {{- end }}
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: pinecall-gateway, port: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pinecall-https
spec:
  parentRefs: [{ name: pinecall, sectionName: http }]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
{{- if .Values.ingress.gkePolicies }}
{{- range $service, $port := dict "pinecall-gateway" 8080 "pinecall-livekit-production" 7880 "pinecall-livekit-sandbox" 7880 }}
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ $service }}
spec:
  default:
    timeoutSec: 3600
    connectionDraining: { drainingTimeoutSec: 60 }
  targetRef: { group: "", kind: Service, name: {{ $service }} }
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ $service }}
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck: { port: {{ $port }}, requestPath: / }
  targetRef: { group: "", kind: Service, name: {{ $service }} }
{{- end }}
{{- end }}
