# The one name on the global address Terraform reserves, on Google's HTTPS load balancer through
# the Gateway API, with Certificate Manager's certificate (modules/edge); plain HTTP sent to HTTPS.
# LiveKit's signalling paths go to production's LiveKit, the same paths under /sandbox to the
# sandbox's with the prefix taken off, everything else to the gateways; a socket lives up to an
# hour on any of them (an app's, a room's).
{{- $paths := list "/rtc" "/twirp" "/validate" "/agent" }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pinecall
  annotations:
    networking.gke.io/certmap: {{ required "ingress.certificateMap" .Values.ingress.certificateMap | quote }}
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: {{ required "ingress.address" .Values.ingress.address | quote }}
  listeners:
    - { name: https, protocol: HTTPS, port: 443 }
    - { name: http, protocol: HTTP, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pinecall
spec:
  parentRefs: [{ name: pinecall, sectionName: https }]
  hostnames:
    - {{ required "domain" .Values.domain | quote }}
  rules:
    - matches:
        {{- range $paths }}
        - path: { type: PathPrefix, value: {{ . }} }
        {{- end }}
      backendRefs: [{ name: pinecall-livekit-production, port: 7880 }]
    {{- range $paths }}
    - matches: [{ path: { type: PathPrefix, value: /sandbox{{ . }} } }]
      filters:
        - type: URLRewrite
          urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: {{ . }} } }
      backendRefs: [{ name: pinecall-livekit-sandbox, port: 7880 }]
    {{- end }}
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: pinecall-gateway, port: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pinecall-https
spec:
  parentRefs: [{ name: pinecall, sectionName: http }]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
{{- range $service, $port := dict "pinecall-gateway" 8080 "pinecall-livekit-production" 7880 "pinecall-livekit-sandbox" 7880 }}
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ $service }}
spec:
  default:
    timeoutSec: 3600
    connectionDraining: { drainingTimeoutSec: 60 }
  targetRef: { group: "", kind: Service, name: {{ $service }} }
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ $service }}
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck: { port: {{ $port }}, requestPath: / }
  targetRef: { group: "", kind: Service, name: {{ $service }} }
{{- end }}
