# Staging's release of charts/pinecall: the names, the secrets, the address Terraform made
# (environments/staging's outputs). The image's tag is the commit, given by `make deploy`.
domains:
  production: staging.pinecall.io
  sandbox: sandbox.staging.pinecall.io
secrets:
  project: hiding-place-447317-c6
  prefix: pinecall-staging-
ingress:
  address: pinecall-staging-ingress
  certificateMap: pinecall-staging
# terraform/modules/backups (environments/staging's outputs): charts/postgres's bucket and identity.
postgres:
  backups:
    bucket: pinecall-staging-postgres-209548925515
    serviceAccount: pinecall-staging-postgres@hiding-place-447317-c6.iam.gserviceaccount.com
# terraform/modules/edge and kubeip (environments/staging's outputs): the core node's static address.
core:
  address: 34.121.208.198
  filter: labels.pinecall-core=staging
  kubeip: pinecall-staging-kubeip@hiding-place-447317-c6.iam.gserviceaccount.com
sipDomains:
  production: sip.staging.pinecall.io
  sandbox: sip.sandbox.staging.pinecall.io
