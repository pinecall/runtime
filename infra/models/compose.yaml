# The open stack: three model servers on one NVIDIA GPU, each OpenAI- or Riva-shaped, so the box
# runs them through the livekit plugins it already has and names no vendor in code.
#   ollama        the LLM (Gemma 4 12B) and the embedder (bge-m3), OpenAI-shaped, :11434
#   kokoro        the voice (Kokoro-82M), OpenAI-shaped /v1/audio/speech, :8880
#   nemotron-asr  the ears (NVIDIA Nemotron ASR Streaming, 40 locales), Riva gRPC :50051, HTTP :9000
# Needs the NVIDIA driver and the container toolkit. MODELS_BIND is the address the box reaches:
# 127.0.0.1 when the box is this machine, a private address when it is another. NGC_API_KEY, a
# free key from ngc.nvidia.com, pulls the ASR's image and model; keep it in .env beside this file.
# About 14 GB of GPU memory with everything loaded; the ASR builds its engine on the first start
# (~15 min), the cache volume keeps it.

name: pinecall-models

services:
  ollama:
    image: docker.io/ollama/ollama:0.32.1@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0
    environment:
      # A phone call's prompt is short: at 8k the model and its cache stay whole on the GPU.
      OLLAMA_CONTEXT_LENGTH: "8192"
      # Loaded once and kept: a cold load is ~20 s, longer than any caller waits.
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_FLASH_ATTENTION: "1"
    volumes: [ollama:/root/.ollama]
    ports: ["${MODELS_BIND:-127.0.0.1}:11434:11434"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  # Pulls the two models once and loads the LLM, then exits; a restart of the stack re-runs it.
  ollama-models:
    image: docker.io/ollama/ollama:0.32.1@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0
    environment: {OLLAMA_HOST: "ollama:11434"}
    entrypoint:
      - sh
      - -ec
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull gemma4:12b
        ollama pull bge-m3
        ollama run gemma4:12b "" >/dev/null
    depends_on: [ollama]
    restart: "no"

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.9.0@sha256:9ba150465c6b8f5d6b1c62b54de83eb9aa0a1444aad8a1a9c8948eed60564b76
    ports: ["${MODELS_BIND:-127.0.0.1}:8880:8880"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  # A new volume is root's; the ASR runs as uid 1000 and cannot write its model into it.
  nim-cache-owner:
    image: nvcr.io/nim/nvidia/nemotron-asr-streaming@sha256:89093f05430be97fbc15e150a08a7d830fd409e402b19b7f7ad06528727281dc
    user: "0"
    entrypoint: ["chown", "-R", "1000:1000", "/opt/nim/.cache"]
    volumes: [nim-cache:/opt/nim/.cache]
    restart: "no"

  nemotron-asr:
    image: nvcr.io/nim/nvidia/nemotron-asr-streaming@sha256:89093f05430be97fbc15e150a08a7d830fd409e402b19b7f7ad06528727281dc
    depends_on:
      nim-cache-owner: {condition: service_completed_successfully}
    environment:
      NGC_API_KEY: "${NGC_API_KEY:?NGC_API_KEY is a free key from ngc.nvidia.com, in .env}"
      # The multilingual model at batch 32: ~5 GB of GPU memory; the default picks batch 128, ~14 GB.
      NIM_TAGS_SELECTOR: "name=nemotron-asr-streaming,type=multi,batch_size=32"
      NIM_HTTP_API_PORT: "9000"
      NIM_GRPC_API_PORT: "50051"
    shm_size: 8gb
    # The image runs as uid 1000 and writes its model and engine here.
    volumes: [nim-cache:/opt/nim/.cache]
    ports:
      - "${MODELS_BIND:-127.0.0.1}:50051:50051"
      - "${MODELS_BIND:-127.0.0.1}:9000:9000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

volumes:
  ollama:
  nim-cache:
