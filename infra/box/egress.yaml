# livekit-egress: found through redis only; the pair arrives from media.env.
ws_url: ws://pinecall-livekit:7880
redis:
  address: pinecall-redis:6379
health_port: 7980
log_level: info
# An audio room composite with no layout runs on livekit's SDK, not Chromium (egress
# pkg/config/pipeline.go ShouldUseSDKSource); past the ceiling a call is taken and not recorded.
cpu_cost:
  audio_room_composite_cpu_cost: 1
max_cpu_utilization: 0.8
