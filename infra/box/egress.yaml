# livekit-egress: found through redis only; the pair arrives from media.env.
ws_url: ws://pinecall-livekit:7880
redis:
  address: pinecall-redis:6379
  # install.sh writes it in; the file it installs is root's and the media group's alone.
  password: "@REDIS_PASSWORD@"
health_port: 7980
log_level: info
# A call is recorded a track at a time (worker/_recorder.py): a track egress copies the track's
# Opus into an Ogg with no decode and no encode, so a track costs egress little of a core; the
# default (a whole core a track) would take three tracks on a 4-vCPU box and refuse the rest.
# Past the ceiling a track is taken and not recorded.
cpu_cost:
  track_cpu_cost: 0.1
max_cpu_utilization: 0.8
