# The journal, bounded: a worker in a crash loop, or a gateway logging every request in json,
# must never fill the disk Postgres writes to. A gigabyte of journal is a month of a busy box;
# two gigabytes are always left free; nothing older than a month is kept. Installed to
# /etc/systemd/journald.conf.d/ by infra/box/Makefile, and journald restarted when it changed.
[Journal]
SystemMaxUse=1G
SystemKeepFree=2G
MaxRetentionSec=1month
