#!/usr/sbin/nft -f
# The fence: SIP from the carrier alone, the web and WebRTC from anyone, ssh. Installed to
# /etc/nftables.conf; podman's own tables stand beside this one, so nothing here flushes them.

destroy table inet pinecall

table inet pinecall {

	# Twilio's signalling edges (twilio.com/docs/sip-trunking/ip-addresses, read 2026-09-08).
	set carrier_signalling {
		type ipv4_addr
		flags interval
		elements = {
			54.172.60.0/30,
			54.244.51.0/30,
			54.171.127.192/30,
			35.156.191.128/30,
			54.65.63.192/30,
			54.169.127.128/30,
			54.252.254.64/30,
			177.71.206.192/30,
		}
	}

	# The database's replica on another machine (infra/cell/primary.sh fills it): empty on a box
	# with none, and Postgres is then published on loopback alone.
	set replicas {
		type ipv4_addr
	}

	# Gateway machines of this cell (infra/cell/primary.sh allow-gateway fills it): they reach
	# Postgres, Redis and LiveKit's API here; empty on a box whose gateways are all its own.
	set gateways {
		type ipv4_addr
	}

	# Worker machines of this cell (infra/cell/primary.sh allow-worker fills it): they reach
	# LiveKit's API and the gateways' balancer (8088) here, and nothing else of the box. An
	# address, or the range of a subnet the fleet loop makes its machines in.
	set workers {
		type ipv4_addr
		flags interval
	}

	# In `raw` prerouting: a published container port is DNAT'd and routed, so it never crosses
	# `input`, and a 5060 rule there fences nothing.
	chain prerouting {
		type filter hook prerouting priority raw; policy accept;
		ip saddr @carrier_signalling meta l4proto { tcp, udp } th dport 5060 accept
		# The SIP container's own answers leave the bridge for the carrier's 5060 too.
		iifname "podman*" meta l4proto { tcp, udp } th dport 5060 accept
		meta l4proto { tcp, udp } th dport 5060 counter drop comment "5060 from anyone but the carrier"
		iifname != "lo" iifname != "podman*" tcp dport 5432 ip saddr != @replicas ip saddr != @gateways counter drop comment "5432 from anyone but the replica and the gateways"
		iifname != "lo" iifname != "podman*" tcp dport 6379 ip saddr != @gateways counter drop comment "Redis from anyone but the gateways"
		iifname != "lo" iifname != "podman*" tcp dport 7880 ip saddr != @gateways ip saddr != @workers counter drop comment "LiveKit's API from anyone but the gateways and the workers"
	}

	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		icmp type echo-request accept
		icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
		# The cloud's DHCP renewals arrive unicast; a lapsed lease takes the box off the net.
		udp dport 68 accept
		# aardvark-dns answers the containers on the bridge's address, which is this host.
		iifname "podman*" meta l4proto { tcp, udp } th dport 53 accept
		tcp dport 22 accept
		tcp dport { 80, 443 } accept
		# The gateways' balancer, for the cell's worker machines.
		ip saddr @workers tcp dport 8088 accept
	}

	chain forward {
		type filter hook forward priority filter; policy accept;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

# What primary.sh adds to the sets above (the replica's, the gateways', the workers' addresses),
# and carriers.nft, which `pinecall-runtime fence apply` writes every minute: the carriers the
# operator admits and the addresses he approved, added to carrier_signalling.
include "/etc/pinecall/nftables.d/*.nft"
