#!/usr/sbin/nft -f
# The fence, on the machine itself and on no cloud: what may reach this box, whole, in one file.
# Installed to /etc/nftables.conf by infra/box/Makefile and reloaded on every deploy.
#
# A SIP port open to the internet is found and probed within hours, and every INVITE a scanner
# sends is a room, a job and a model's bill if it gets through. So 5060 is open to the carrier's
# signalling networks and to nobody else — and the drop is written out with a counter, so a reader
# sees the fence and not just a preference, and `nft list table inet pinecall` shows it working.
#
# Media is open: RTP legitimately arrives from any of the carrier's media addresses and WebRTC
# from any browser anywhere, and without an admitted INVITE nothing is listening for a stranger's
# packet on those ports anyway.
#
# This table stands beside the ones podman keeps for its containers, and never touches them:
# a published port is DNAT'd to a container before it reaches `input`, and `forward` here accepts
# what netavark already decided. There is no `flush ruleset` in this file for that reason.

destroy table inet pinecall

table inet pinecall {

	# Who may ring this box. Twilio's signalling edges as it publishes them (twilio.com/docs/
	# sip-trunking/ip-addresses, read 2026-09-08): a /30 per edge and nothing wider, so nothing
	# wider is written here. Another carrier is another list. infra/tools/carrier_cidrs.py reads
	# this set for the inbound trunk, so the firewall and the trunk cannot disagree.
	set carrier_signalling {
		type ipv4_addr
		flags interval
		elements = {
			54.172.60.0/30,
			54.244.51.0/30,
			54.171.127.192/30,
			35.156.191.128/30,
			54.65.63.192/30,
			54.169.127.128/30,
			54.252.254.64/30,
			177.71.206.192/30,
		}
	}

	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		# Pings, and the neighbour discovery IPv6 cannot stand without.
		icmp type echo-request accept
		icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
		# The cloud's DHCP renewals arrive unicast; a lease that lapses takes the box off the net.
		udp dport 68 accept

		# ssh: the one door a deploy needs.
		tcp dport 22 accept

		# caddy: TLS for the gateway and for the SFU's signalling.
		tcp dport { 80, 443 } accept

		# webrtc media, straight at the host: a proxy in front of media is a proxy inside every call.
		tcp dport 7881 accept
		udp dport 7882 accept

		# sip media: 200 calls' worth of RTP.
		udp dport 10000-10199 accept

		# sip signalling: the carrier, and — read the next line — nobody else.
		ip saddr @carrier_signalling meta l4proto { tcp, udp } th dport 5060 accept
		meta l4proto { tcp, udp } th dport 5060 counter drop comment "5060 from anyone but the carrier"
	}

	chain forward {
		# Container traffic: podman's own tables decide it, and this one stays out of the way.
		type filter hook forward priority filter; policy accept;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
