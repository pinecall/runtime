#!/usr/sbin/nft -f
# The fence, on the machine itself and on no cloud: what may reach this box, whole, in one file.
# Installed to /etc/nftables.conf by infra/box/Makefile and reloaded on every deploy.
#
# A SIP port open to the internet is found and probed within hours, and every INVITE a scanner
# sends is a room, a job and a model's bill if it gets through. So 5060 is open to the carrier's
# signalling networks and to nobody else — and the drop is written out with a counter, so a reader
# sees the fence and not just a preference, and `nft list table inet pinecall` shows it working.
#
# Media is open: RTP legitimately arrives from any of the carrier's media addresses and WebRTC
# from any browser anywhere, and without an admitted INVITE nothing is listening for a stranger's
# packet on those ports anyway.
#
# This table stands beside the ones podman keeps for its containers, and never touches them:
# a published port is DNAT'd to a container before it reaches `input`, and `forward` here accepts
# what netavark already decided. There is no `flush ruleset` in this file for that reason.

destroy table inet pinecall

table inet pinecall {

	# Who may ring this box. Twilio's signalling edges as it publishes them (twilio.com/docs/
	# sip-trunking/ip-addresses, read 2026-09-08): a /30 per edge and nothing wider, so nothing
	# wider is written here. Another carrier is another list. infra/tools/carrier_cidrs.py reads
	# this set for the inbound trunk, so the firewall and the trunk cannot disagree.
	set carrier_signalling {
		type ipv4_addr
		flags interval
		elements = {
			54.172.60.0/30,
			54.244.51.0/30,
			54.171.127.192/30,
			35.156.191.128/30,
			54.65.63.192/30,
			54.169.127.128/30,
			54.252.254.64/30,
			177.71.206.192/30,
		}
	}

	# The fence, and it is here rather than in `input` for the reason measured on 2026-09-09: a
	# packet for a published container port is DNAT'd in `nat prerouting` and then ROUTED, so it
	# traverses `forward` and never `input`. A 5060 rule in `input` would have fenced nothing and
	# read exactly like a fence. `raw` runs before conntrack and before DNAT, so this chain sees
	# every packet that enters this machine, with the port the carrier actually dialled.
	chain prerouting {
		type filter hook prerouting priority raw; policy accept;

		# sip signalling: the carrier, and — read the last line — nobody else.
		ip saddr @carrier_signalling meta l4proto { tcp, udp } th dport 5060 accept
		# The SIP container's own answers cross this hook too: a 180, a 200 OK, an ACK, each leaving
		# the bridge for the carrier's 5060, from an address that is not the carrier's. Measured on
		# 2026-09-16, the first call after livekit-sip moved into a container: every response died
		# on the line below, Twilio retransmitted the INVITE until the caller gave up, and the drop
		# counter read 224. What arrives from the bridge is the container's, and the container
		# only ever speaks to whoever rang it; the fence is about who may ring, and that is above.
		iifname "podman*" meta l4proto { tcp, udp } th dport 5060 accept
		meta l4proto { tcp, udp } th dport 5060 counter drop comment "5060 from anyone but the carrier"
	}

	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		# Pings, and the neighbour discovery IPv6 cannot stand without.
		icmp type echo-request accept
		icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
		# The cloud's DHCP renewals arrive unicast; a lease that lapses takes the box off the net.
		udp dport 68 accept

		# The containers' own DNS. aardvark-dns answers on the bridge's address — 10.89.0.1 — so a
		# container asking for `pinecall-redis` sends a packet TO THE HOST, and it arrives here.
		# Without this line every container resolves nothing, says "bad address", and livekit sits
		# up and silent with no redis: measured on the box on 2026-09-09, and the only symptom is a
		# healthcheck that never turns green. Only 53, and only from a podman bridge.
		iifname "podman*" meta l4proto { tcp, udp } th dport 53 accept

		# ssh: the one door a deploy needs, and the only way back in if a line below is wrong.
		tcp dport 22 accept

		# caddy, which runs on the host itself: TLS for the gateway and for the SFU's signalling.
		tcp dport { 80, 443 } accept
	}

	chain forward {
		# Everything published by a container is DNAT'd before it is routed, so it arrives HERE and
		# never in `input`. netavark's own rules decide the rest; this chain adds nothing to them.
		type filter hook forward priority filter; policy accept;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
