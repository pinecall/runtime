# Every directory the box needs, with its owner and mode, made by systemd-tmpfiles at boot and on
# every deploy; a directory that is there is left as it is. Ownership follows who WRITES:
# the service user owns the virtualenv, uv's cache and the recordings; root owns the credstore;
# /opt/pinecall/app belongs to the account rsync arrives as, and is not declared here because
# that account is yours — infra/box/cloud-init.yaml makes it.
# Installed to /etc/tmpfiles.d/ by infra/box/Makefile.
#Type Path                             Mode  User      Group     Age  Argument
d     /opt/pinecall                    0755  root      root      -    -
d     /opt/pinecall/bin                0755  root      root      -    -
d     /opt/pinecall/venv               0755  pinecall  pinecall  -    -
d     /opt/pinecall/.cache             0755  pinecall  pinecall  -    -
# Where a tenant's app lands when it is held here (pinecall-app@.service). Each app's directory
# is the deploy account's, made by that app's deploy the way cloud-init makes /opt/pinecall/app.
d     /opt/pinecall/apps               0755  root      root      -    -
# A customer's voice: readable by the service, by the recorder that writes it, and by nobody
# else. The recorder is a container and runs as no uid this box can name in advance, so the two
# meet on a GROUP with a fixed id (sysusers.d/pinecall.conf) — and the directory is setgid, so a
# file egress writes into it stays readable by the gateway that serves it.
d     /var/lib/pinecall                0755  root      root           -    -
d     /var/lib/pinecall/recordings     2770  pinecall  pinecall-media -    -
# The stamps pinecall-postgres-image.service leaves, one per image tag it has built.
d     /var/lib/pinecall/images         0755  root      root      -    -
# Where the fleet loop's cloud CLI keeps its configuration (CLOUDSDK_CONFIG); nothing secret,
# the credential is the VM's own service account, read from the metadata server.
d     /var/lib/pinecall/gcloud         0750  pinecall  pinecall  -    -
# Where every secret lives, encrypted under the machine's own key: ImportCredential= reads here.
d     /etc/credstore.encrypted         0700  root      root      -    -
d     /etc/pinecall                    0755  root      root      -    -
# One env file per instance, readable as box.env is, and beside each its own credstore, 0700,
# which `box secrets --instance` makes; each instance's recordings are a directory `box instance`
# makes under the root above, owned as the root is.
d     /etc/pinecall/instances          0755  root      root      -    -
