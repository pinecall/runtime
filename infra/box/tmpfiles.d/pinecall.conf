# Every directory of the box, its owner and mode; the owner is whoever writes it.
#Type Path                              Mode  User      Group           Age  Argument
d     /opt/pinecall                     0755  root      root            -    -
d     /opt/pinecall/bin                 0755  root      root            -    -
d     /opt/pinecall/venv                0755  deploy    deploy          -    -
d     /opt/pinecall/wheels              0755  deploy    deploy          -    -
d     /opt/pinecall/.cache              0750  pinecall  pinecall        -    -
d     /var/lib/pinecall                 0755  root      root            -    -
d     /var/lib/pinecall/recordings      2770  pinecall  pinecall-media  -    -
d     /var/lib/pinecall/images          0755  root      root            -    -
# Written by Postgres inside its container, uid and gid 999 in the image.
d     /var/lib/pinecall/wal             0700  999       999             -    -
d     /etc/credstore.encrypted          0700  root      root            -    -
d     /etc/pinecall                     0755  root      root            -    -
d     /etc/pinecall/fleets              0755  root      root            -    -
d     /etc/pinecall/nftables.d          0755  root      root            -    -
