# livekit-sip: the pair arrives as LIVEKIT_API_KEY / LIVEKIT_API_SECRET from media.env.
ws_url: ws://pinecall-livekit:7880
redis:
  address: pinecall-redis:6379
  # install.sh writes it in; the file it installs is root's and the media group's alone.
  password: "@REDIS_PASSWORD@"
sip_port: 5060
# 200 concurrent calls; closed to all but the carrier by nftables.
rtp_port:
  start: 10000
  end: 10199
use_external_ip: true
# An INVITE for a number no trunk lists gets no answer at all: a scanner learns nothing and
# opens no room.
hide_inbound_port: true
health_port: 8081
log_level: info
