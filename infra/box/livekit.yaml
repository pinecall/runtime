# livekit-server: one node; the pair arrives as LIVEKIT_KEYS from the media.env credential.
port: 7880
rtc:
  # A cloud VM sees its private address; the SFU learns the public one by STUN.
  use_external_ip: true
  # One muxed UDP port and one TCP port: two firewall rules.
  udp_port: 7882
  tcp_port: 7881
redis:
  address: pinecall-redis:6379
room:
  auto_create: true
  empty_timeout: 60
logging:
  level: info
# Every room event, signed with the box's own key, to the box's own gateways (Caddy's site for
# this container): an agent lost mid-call is how a dead worker is known, and a track's egress
# ending is how its file, on this box's disk, is sealed. install.sh writes the key's @name@.
webhook:
  api_key: "@LIVEKIT_API_KEY@"
  urls:
    - http://host.containers.internal:8089/v1/livekit/webhook
