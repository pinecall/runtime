# The one thing Caddy has to be told per box: which name it answers to.
#
# The Caddyfile reads it as {$PINECALL_DOMAIN}, and Caddy's own packaged unit reads no environment
# file at all — so without this drop-in the placeholder is EMPTY, the site block collapses to a
# bare `{ … }`, and Caddy reads it as the global options block: "unrecognized global option:
# @livekit", which says nothing about the domain that is actually missing.
# Installed at /etc/systemd/system/caddy.service.d/ by infra/box/setup.sh.
[Service]
EnvironmentFile=/etc/default/caddy
