# What a runtime process may touch, and it is installed as a drop-in under every long-running
# unit of the runtime — pinecall-gateway@, pinecall-worker@, pinecall-overflow, pinecall-fleet —
# as /etc/systemd/system/<unit>.service.d/hardening.conf, by infra/box/Makefile. One file, because
# the four processes are the same Python on the same box and may touch the same things: their
# virtualenv and the code, read; the cache livekit's plugins keep a model in, the recordings and
# the fleet loop's cloud configuration, written — each unit names its own in ReadWritePaths=.
# Everything else on the machine is read-only or invisible to them, the way `systemd-analyze
# security` grades it. What is NOT here: the oneshots that mint a key (they catch stdout in /run,
# which a strict file system refuses), pinecall-db@ (it speaks to Postgres through podman, as
# root), and pinecall-app@, a tenant's own Node, which keeps a lighter set in its own file.
#
# A command a unit runs with a `+` — the gateway's `podman healthcheck run` — runs outside all of
# this, as systemd documents: full privileges, no namespace, no filter.
[Service]
NoNewPrivileges=yes
# The whole file system read-only but what ReadWritePaths= in the unit names; /tmp is the
# unit's own (the worker's hold-melody cache lives there and is nobody else's business).
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
# NOT RestrictSUIDSGID=: the worker marks each call's recording directory setgid
# (worker/recording_paths.py), so what egress writes there belongs to pinecall-media, the group
# the runtime reads it as. With the bit forbidden the chmod failed, the group got no write, and
# egress could not create the file: every call after the 2026-09-26 deploy lost its audio.
LockPersonality=yes
RemoveIPC=yes
CapabilityBoundingSet=
# Sockets: the loopback, the internet, and netlink — glibc's getaddrinfo opens one to sort the
# addresses it found, and a family it may not open is an error it hides as "no address".
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
