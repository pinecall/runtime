# What a runtime process may touch; installed as a drop-in of every long-running runtime unit.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
# Not RestrictSUIDSGID=: the worker marks each call's recording directory setgid for egress.
LockPersonality=yes
RemoveIPC=yes
CapabilityBoundingSet=
# glibc's getaddrinfo opens a netlink socket; refused, it reports "no address".
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
