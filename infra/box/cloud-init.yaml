#cloud-config
# A new box on any cloud that takes cloud-init (GCP: the `user-data` metadata key). It makes what
# must exist before `make box`: the packages, the deploy account, uv. Two lines are YOURS.

package_update: true
packages:
  - podman
  - caddy
  - nftables
  - curl
  - rsync
  - openssl
  - age

users:
  # The account `make box` and `make deploy` arrive as. Its sudo serves install.sh, run by you;
  # a deploy restarts units through the polkit rule and never asks for sudo.
  - name: deploy
    groups: [sudo, systemd-journal]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...your-public-key... you@laptop                  # YOURS

runcmd:
  # uv, the release tarball held to the checksum the release publishes; never `curl | sh`.
  - - sh
    - -ec
    - |
      arch=$(uname -m)
      case "$arch" in
        x86_64)  sum=23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8 ;;
        aarch64) sum=0804e9b164c64b6914182d5920c08551958a095986f10a3731056df701126436 ;;
        *) echo "uv: no build for $arch"; exit 1 ;;
      esac
      build=uv-$arch-unknown-linux-gnu
      cd /tmp
      curl -fsSLO https://github.com/astral-sh/uv/releases/download/0.12.19/$build.tar.gz
      echo "$sum  $build.tar.gz" | sha256sum -c --quiet
      tar -xzf $build.tar.gz
      install -d -m 755 /opt/pinecall/bin
      install -m 755 $build/uv $build/uvx /opt/pinecall/bin/
      rm -rf $build $build.tar.gz
  - [systemctl, enable, --now, nftables]

final_message: "ready for `make box BOX=… DOMAINS=…`, after $UPTIME seconds"
