#cloud-config
# A fresh box, on any provider that takes cloud-init — every cloud does, and a bare machine does
# through a NoCloud seed. Paste this as the instance's user-data (GCP: the `user-data` metadata
# key; AWS: User data; Hetzner: cloud config; DigitalOcean: user data). It makes exactly what has
# to exist BEFORE the first `make deploy` can arrive: the packages, the account rsync logs in
# as, the directory it lands in, uv, and the two values that are this box's alone. Everything
# else — the service user, the units, the containers, the firewall, the secrets — arrives with
# the deploy and is made by systemd from the files in infra/box/.
#
# Three lines are yours to fill, marked YOURS. Nothing here is a secret: the secrets are drawn on
# the box itself, by pinecall-secrets.service, the first time it boots with code under it.

package_update: true
packages:
  - podman
  - caddy
  - nftables
  - make
  - curl
  - nodejs      # what a tenant's app runs on (pinecall-app@.service): NodeSource's, put in by bootcmd below

# Before the packages: NodeSource's repository, so `nodejs` above is their 24 and not Ubuntu's 18
# (the framework says `>=24`). The same three lines infra/box/Makefile `node-repo` converges on.
bootcmd:
  - [sh, -c, "test -f /etc/apt/sources.list.d/nodesource.list || { install -d -m 755 /etc/apt/keyrings && curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg && echo 'deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main' > /etc/apt/sources.list.d/nodesource.list; }"]

users:
  # The account `make deploy` arrives as (BOX in deploy.local.mk). It owns the code and can
  # sudo, and it is the only account with a login on this machine.
  - name: deploy                                                           # YOURS, or keep it
    groups: [sudo]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...your-public-key... you@laptop                  # YOURS

write_files:
  # The values that are this box's and nobody else's; every unit reads them here, and each
  # instance's own file (/etc/pinecall/instances/<name>.env) after them, winning over them.
  - path: /etc/pinecall/box.env
    permissions: "0644"
    content: |
      # Production's public name: the first deploy writes instances/production.env from it, and
      # Caddy takes its certificate. infra/box/README.md, "An instance".
      PINECALL_DOMAIN=box.example.com                                      # YOURS
      LIVEKIT_PUBLIC_URL=wss://box.example.com                             # YOURS: wss://<the same>
      # The instances this box runs, each one env file and one credstore under
      # /etc/pinecall/instances/. Unset means `production` alone; a sandbox beside it is
      # `make instance NAME=sandbox …` from the checkout, then its name here.
      #PINECALL_INSTANCES="production sandbox"
      # What this box runs: `all` (one machine, everything), `hub` (control and media, no
      # worker) or `worker` (a worker alone). A worker dials its hub by name, from its instance's
      # own file — infra/box/README.md, "An instance on a box of its own" — and holds the calls
      # it was MEASURED to hold ("Slots").
      PINECALL_ROLE=all                                                    # YOURS
      #LIVEKIT_URL=wss://box.example.com                                   # worker only: the hub's SFU
      # Who turns this box's text into vectors. Unset means `tei`: the embedder runs here as a
      # container, and its first start fetches 2.3 GB of bge-m3. Name a vendor instead and the
      # box runs no embedder at all — then put its key in with `make secret NAME=…`, from the
      # checkout. A worker embeds nothing either way. infra/box/README.md, "The embedder".
      #EMBED_PROVIDER=perplexity                                           # or openrouter
      # Who this box's letters are from, when it sends any: invitations and password resets. The
      # server they go out through is a secret — `make secret NAME=PINECALL_SMTP_URL` — and with
      # neither set the box sends no mail at all. docs/a-box-in-production.md, "The box's mail".
      #PINECALL_MAIL_FROM=Pinecall <noreply@box.example.com>

runcmd:
  # Where the code lands: the deploy account's, because rsync arrives as it and owns what it
  # writes; the service user only reads it. Everything under /opt/pinecall that the service
  # user writes is declared in tmpfiles.d/pinecall.conf and made on the first deploy.
  - [install, -d, -o, deploy, -g, deploy, /opt/pinecall/app]
  # Where a tenant's app lands when it is held on this box (pinecall-app@.service): the same
  # account's, for the same reason. Each app's own directory is made by that app's deploy.
  - [install, -d, -o, deploy, -g, deploy, /opt/pinecall/apps]
  # uv, for the deploy's post-sync alone: the units run the virtualenv's own entrypoint.
  - [sh, -c, "curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/opt/pinecall/bin UV_NO_MODIFY_PATH=1 sh -s -- -q"]
  # The fence is up before any door is: the deploy's own nftables.conf replaces the stock one.
  - [systemctl, enable, --now, nftables]

final_message: "the box is ready for its first `make deploy`, after $UPTIME seconds"
