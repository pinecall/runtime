# The box's media plane and its store: what a self-hosted Pinecall runs under systemd's feet.
# Shipped to /opt/pinecall/media by infra/box/setup.sh and started there, never from a laptop.
#
# The box's ports, whole — the two runtime processes are not in this file but share the host:
#   443 80/tcp                   caddy: TLS for the gateway and the SFU's signalling
#   7881/tcp 7882/udp            livekit media, open to the world (a browser is anywhere)
#   5060 udp+tcp                 sip signalling, open to THE CARRIER ONLY — infra/box/firewall.sh
#   10000-10199/udp              sip media, open (RTP arrives from any of the carrier's media IPs)
#   127.0.0.1:7880               livekit signalling, reached only through caddy
#   127.0.0.1:5432               postgres, reached only by the gateway on this host
#   127.0.0.1:8080               pinecall-runtime gateway, reached only through caddy
# The embedder is not here: memory arrives with its own milestone, and a box that does not
# retrieve should not be holding 2.3 GB of weights.

name: pinecall

services:

  # The bus the two LiveKit services find each other over. Unpublished: it authenticates nobody.
  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    networks: [pinecall]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  livekit:
    image: livekit/livekit-server:v1.13.6
    command: ["--config", "/etc/livekit/server.yaml"]
    restart: unless-stopped
    environment:
      # The flag wants exactly "key: secret", the space included.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit/server.yaml:ro
    ports:
      # Signalling is Caddy's to publish: it terminates the TLS a browser needs.
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks: [pinecall]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "3", "http://127.0.0.1:7880/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  sip:
    image: livekit/sip:v1.13.0
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
    volumes:
      # The path is fixed by the image's entrypoint. See the header of sip.yaml.
      - ./sip.yaml:/sip/config.yaml:ro
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10199:10000-10199/udp"
    networks: [pinecall]
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      # The image carries no wget and no curl, so the probe is bash's own socket.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET / HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The only stateful service, and the only one nothing outside this host may reach: the log
  # holds what a stranger said on the telephone.
  postgres:
    build:
      # The laptop's image, built from the same Dockerfile: one definition of what our Postgres
      # is. setup.sh ships infra/compose/postgres beside this file.
      context: ./postgres
    image: pinecall/postgres:17-pgvector0.8.6-pgtextsearch1.4.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-pinecall}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-pinecall}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [pinecall]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  pinecall:
    driver: bridge

volumes:
  postgres-data:
