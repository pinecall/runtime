# The account the runtime runs as: a system user with no login, whose home is the runtime's own
# directory. systemd-sysusers reads this at boot and on every deploy and makes it exactly once.
# Installed to /etc/sysusers.d/ by infra/box/Makefile.
#Type Name            ID    GECOS                  Home           Shell
u     pinecall        -     "Pinecall runtime"     /opt/pinecall  /usr/sbin/nologin
# The one group a container and the runtime share: the recordings. Its id is FIXED, and the
# runtime's is not — systemd-sysusers takes the next free system id, which is a different number
# on every box, and pinecall-egress.container has to name a number it can know in advance.
g     pinecall-media  4200  -                      -              -
m     pinecall        pinecall-media
