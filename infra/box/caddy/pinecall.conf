# The one thing Caddy has to be told per box: which name it answers to. The Caddyfile reads it
# as {$PINECALL_DOMAIN}, and Caddy's packaged unit reads no environment file — so without this
# drop-in the placeholder is EMPTY, the site block collapses to a bare `{ … }`, and Caddy reads
# it as the global options block: "unrecognized global option: @livekit", which says nothing
# about the domain that is actually missing.
# Installed to /etc/systemd/system/caddy.service.d/ by infra/box/Makefile.
[Service]
EnvironmentFile=/etc/pinecall/box.env
