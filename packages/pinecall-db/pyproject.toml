# pinecall-db: the Pinecall runtime's database: the driver's one door, the pool, the numbered migrations.
# A portion of the `pinecall` namespace, released with the others at one version (packages/).

[project]
name = "pinecall-db"
version = "0.1.0"
description = "The Pinecall runtime's database: the driver's one door, the pool, the numbered migrations"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Bernardo Castro", email = "me@bernardocastro.dev" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pinecall-core==0.1.0",
  "asyncpg>=0.29,<1",
]

[project.urls]
Homepage = "https://github.com/pinecall/runtime"
Repository = "https://github.com/pinecall/runtime"

[tool.uv.sources]
pinecall-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# A namespace portion: no pinecall/__init__.py in this wheel or in any sibling's.
[tool.hatch.build.targets.wheel]
packages = ["src/pinecall"]

[tool.deptry]
known_first_party = ["pinecall"]

[tool.deptry.per_rule_ignores]
# The siblings are imported on every other line, as `pinecall.<package>`: deptry reads a
# namespace by its top-level name alone, and `pinecall` is first-party here.
DEP002 = ["pinecall-core"]
