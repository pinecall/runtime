# The runtime's own distribution, `pinecall`: two processes, one wheel. The workspace, the
# tools and the suites' configuration are the repository's pyproject.toml, two directories up.

[project]
name = "pinecall"
description = "The Pinecall voice-AI runtime: gateway and worker, on LiveKit"
readme = "README.md"
license = "Apache-2.0"
# PEP 639: the text itself travels in the wheel and the sdist, so an install carries its licence.
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Bernardo Castro", email = "me@bernardocastro.dev" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Telephony",
]
keywords = ["voice", "telephony", "livekit", "contact-center", "agents"]
dependencies = [
  "pinecall-core>=0.1,<0.2",
  "pinecall-db==0.1.0",
  "pinecall-log==0.1.0",
  "pinecall-providers==0.1.0",
  "pinecall-settings==0.1.0",
  # argon2id, and nothing else: a member's password is a secret a person invented.
  "argon2-cffi>=23.1,<26",
  # livekit-agents' own, imported by name: PyAV decodes the hold audio.
  "av>=13,<19",
  # Fernet, and nothing else: a tenant's own provider key is encrypted at rest under PINECALL_VAULT_KEY.
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "livekit-agents>=1.8,<2",
  "livekit-api>=1.2.1",
  # livekit's tracer, handed a provider that exports over OTLP/HTTP when PINECALL_OTLP_ENDPOINT names where.
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  # A range, not a bare name: the wheel PyPI serves must say which protocol it speaks.
  "pinecall-protocol>=0.6.14,<0.7",
  # livekit-agents' own, imported by name: what a room's egress token carries.
  "protobuf>=5,<8",
  "pydantic>=2.7,<3",
  "pyjwt>=2.13.0",
  # fastapi's own, named because the doors import `starlette.*` by that name.
  "starlette>=0.40,<2",
  # The server the gateway runs in; cli/gateway.py stops it the way a stream needs.
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/pinecall/runtime"
Repository = "https://github.com/pinecall/runtime"
Changelog = "https://github.com/pinecall/runtime/blob/main/CHANGELOG.md"
Issues = "https://github.com/pinecall/runtime/issues"
Security = "https://github.com/pinecall/runtime/blob/main/SECURITY.md"

[project.optional-dependencies]
# The vendors' plugins are the providers' extras; these name them, so `pip install pinecall[runtime]`
# and a box's `uv sync --extra runtime --extra providers` read the same as before the split.
runtime = ["pinecall-providers[runtime]==0.1.0"]
providers = ["pinecall-providers[providers]==0.1.0"]
providers-big = ["pinecall-providers[providers-big]==0.1.0"]

[project.scripts]
pinecall-runtime = "pinecall.cli:main"

[tool.uv.sources]
pinecall-protocol = { path = "../../../protocol/python", editable = true }
pinecall-core = { workspace = true }
pinecall-db = { workspace = true }
pinecall-log = { workspace = true }
pinecall-providers = { workspace = true }
pinecall-settings = { workspace = true }

[build-system]
# 1.27 is the first hatchling that writes `license` as a PEP 639 expression.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pinecall/_version.py"

# The console is a build the agents repo's vite wrote and scripts/console copied in: git-ignored,
# because it is not a source, and named here so the wheel carries it anyway.
# A namespace portion: no pinecall/__init__.py in this wheel or in the core's, which carries
# pinecall.types, pinecall.extensions and pinecall.errors.
[tool.hatch.build.targets.wheel]
packages = ["src/pinecall"]
artifacts = ["src/pinecall/public/console/**", "src/pinecall/public/widget/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/pinecall/public/console/**", "src/pinecall/public/widget/**"]

# ── deptry ──────────────────────────────────────────────────────────────────────

# What the tree imports against what pyproject declares, both ways: an import of something only
# a dependency dragged in breaks on the day that dependency drops it, and a declared package
# nobody imports is a wheel nobody needed.
[tool.deptry]
known_first_party = ["pinecall"]

[tool.deptry.package_module_name_map]
argon2-cffi = ["argon2"]
livekit-agents = ["livekit"]
livekit-api = ["livekit"]
opentelemetry-exporter-otlp-proto-http = ["opentelemetry"]
opentelemetry-sdk = ["opentelemetry"]
pinecall-protocol = ["pinecall_protocol"]
protobuf = ["google"]
pyjwt = ["jwt"]

[tool.deptry.per_rule_ignores]
# The siblings are imported on every other line, as `pinecall.<package>`: deptry reads a
# namespace by its top-level name alone, and `pinecall` is first-party here.
DEP002 = ["pinecall-core", "pinecall-db", "pinecall-log", "pinecall-providers", "pinecall-settings"]
