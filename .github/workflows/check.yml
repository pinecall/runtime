name: check

# A branch's commits are checked by its pull request; main's, by the push that lands them.
on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these as its gates before a wheel reaches PyPI.
  workflow_call:

permissions:
  contents: read

jobs:
  rules:
    name: the rules and the suites with no database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q -n auto

  # What ships and what is written down, against what is known: the image's locked dependencies
  # against the advisories, every commit for a secret, the infrastructure and the charts as
  # production releases them for a misconfiguration (infra/trivy-ignore.yaml says what stands and
  # why). Each tool at a version and its release's checksum.
  supply-chain:
    name: dependencies, secrets and configuration, scanned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: the image's dependencies, as uv.lock pins them (pip-audit)
        run: |
          uv export --locked --extra voice --no-dev --no-emit-project --quiet -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.9.0 -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --progress-spinner off
      - name: every commit, for a secret (gitleaks)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .
      - name: the infrastructure and the charts as released (trivy)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tgz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  $RUNNER_TEMP/trivy.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          rendered="$RUNNER_TEMP/rendered"
          for chart in edge postgres pinecall; do
            helm template "$chart" "infra/charts/$chart" -f infra/values/production.yaml \
              --set image.tag=ci --output-dir "$rendered"
          done
          helm template hosting infra/charts/hosting -f infra/values/hosting-production.yaml \
            --set image.tag=ci --output-dir "$rendered"
          for target in infra "$rendered"; do
            "$RUNNER_TEMP/trivy" config --quiet --severity HIGH,CRITICAL --exit-code 1 \
              --ignorefile infra/trivy-ignore.yaml "$target"
          done

  terraform:
    name: terraform, formatted and valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7
      - run: make tf-check

  suites:
    name: every suite, on Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: the Postgres of infra/local/postgres, on tmpfs
        run: |
          docker build -t pinecall/postgres infra/local/postgres
          docker run -d --name postgres -p 127.0.0.1:5432:5432 --tmpfs /var/lib/postgresql/data \
            -e POSTGRES_USER=pinecall -e POSTGRES_PASSWORD=pinecall -e POSTGRES_DB=pinecall \
            pinecall/postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          until docker exec postgres pg_isready -U pinecall -d pinecall; do sleep 1; done
      - run: uv run pytest -q -n auto
        env:
          DATABASE_URL: postgresql://pinecall:pinecall@127.0.0.1:5432/pinecall
