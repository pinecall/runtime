# A `v*` tag is the publication: `git push origin vX.Y.Z` puts ONE wheel on PyPI, `pinecall`, with
# the console and the widget inside, so `pip install pinecall-runtime` answers every screen. No sdist: the
# pages are built from two other repositories, which no checkout of this one carries.
name: release

on:
  push:
    tags: ["v*"]
  # A rehearsal that burns no number: guard, gates and build run, publish is skipped (no tag).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A PyPI version is permanent: a wheel whose name lies cannot be taken back.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the tag and pyproject.toml say the same number
        if: github.ref_type == 'tag'
        run: |
          declared=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "the tag says ${GITHUB_REF_NAME#v} and pyproject.toml says $declared" >&2
            exit 1
          fi

  # A tag matches no `push: branches`, so without this line the release would run no gate at all.
  gates:
    uses: ./.github/workflows/check.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: runtime
      # The console and the widget at the commits console.lock names, never their branches' heads.
      - name: the console and the widget this release was made with
        id: locked
        working-directory: runtime
        run: |
          locked=$(grep -E '^(console|widget) [0-9a-f]{40}$' console.lock)
          if [ "$(printf '%s\n' "$locked" | wc -l)" -ne 2 ]; then
            echo "console.lock must name one commit for the console and one for the widget" >&2
            exit 1
          fi
          printf '%s\n' "$locked" | tr ' ' '=' >> "$GITHUB_OUTPUT"
      # scripts/console reads ../console and ../widget: the layout these three checkouts make.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pinecall/console
          ref: ${{ steps.locked.outputs.console }}
          path: console
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pinecall/widget
          ref: ${{ steps.locked.outputs.widget }}
          path: widget
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
        working-directory: console
      - run: scripts/console
        working-directory: runtime
      - run: uv build --wheel --out-dir dist
        working-directory: runtime
      # A wheel without the pages installs a gateway that answers every screen with a refusal.
      - name: the wheel carries the console and the widget
        working-directory: runtime
        run: |
          unzip -l dist/pinecall_runtime-*.whl | grep -q 'pinecall/public/console/index.html'
          unzip -l dist/pinecall_runtime-*.whl | grep -q 'pinecall/public/widget/pinecall-widget.js'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel
          path: runtime/dist/

  # Trusted Publishing works only in a top-level job: the gates are reused, the publish stays here.
  publish:
    needs: [guard, gates, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC: no token stored anywhere
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true   # a workflow run again is not an error
