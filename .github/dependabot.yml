# One pull request a week per ecosystem: the lock, the actions this repo pins by commit, and the
# Postgres image the dev stack and a box build from. Vendor SDKs are ranges in pyproject and move
# with the lock; livekit-agents is the one a person reads the changelog of before merging.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      livekit:
        patterns: ["livekit-*"]
      tooling:
        patterns: ["ruff", "pyright", "mypy", "pytest*", "hypothesis", "deptry", "squawk-cli"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra/compose/postgres
    schedule:
      interval: weekly
